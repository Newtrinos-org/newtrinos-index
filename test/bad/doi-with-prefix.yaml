card:
  summary: |-
    The final Daya Bay nGd data set with everything needed to redo the published θ13 / Δm²32 measurement. Aimed at
    anyone fitting reactor oscillation data, including global fits.
  intended_use: "Reproduce or extend the PRL 130, 161802 oscillation fit; include Daya Bay in global fits; sterile-neutrino or BSM fits of the far/near ratio."
  out_of_scope_use: "Absolute reactor-flux or spectral-shape studies need the separate Daya Bay flux/spectrum releases; nH-capture sample not included."
  provenance: "Official collaboration release (Zenodo, 2025) with identical mirrors at NHEPSDC; analysis inputs as used for PRL 130, 161802."
  composition: "IBD candidates per AD with daily livetime/efficiency, accidental rates, background spectra and rates, reactor power and fission fractions, detector response (IAV, LSNL, resolution) and their uncertainties."
  systematics: "Full nuisance model available through the official dayabay-model code (~180 nuisance parameters); a Δχ² table is part of the release."
  validation: "Newtrinos reproduces the official model prediction to <1e-4 per bin (546 bins) and the official fit (sin²2θ13 0.08536 vs 0.08538, Δm²32 2.4748 vs 2.4746 ×10⁻³ eV²), see the verification entry 10.5281_zenodo.17587229."
  known_limitations: "The published Δχ² table is slightly wider at low values than both the official code and Newtrinos. Huber–Mueller spectral uncertainties are not included in the official default fit."
  maintenance: "Versioned on Zenodo (v1.0.0); feedback via GitHub issues of dayabay-data-official."
  usage_examples: "pip install dayabay-model-official; examples in github.com/dagflow-team/dayabay-analysis. Newtrinos: `Newtrinos.daya_bay_3158days`."
  dphep_level: 3
  fair: {findable: true, accessible: true, interoperable: true, reusable: true}
