title: Full Data Release of the Daya Bay Reactor Neutrino Experiment
short: "Daya Bay: all 5.55 M nGd IBD candidates (3158 days) plus every input needed for the θ13 / Δm²32 fit"
description: |-
  The complete nGd inverse-beta-decay sample of Daya Bay (8 antineutrino detectors, 2011–2020, 3158 days) with
  daily livetimes and efficiencies, accidental-background rates and all inputs of the final oscillation analysis
  (Phys. Rev. Lett. 130, 161802). Two variants: the *full dataset* (event level, ~200 MB per format) and the
  *analysis dataset* (per-period IBD histograms and inputs, ~1 MB per format), each in HDF5, NPZ, ROOT and TSV.
