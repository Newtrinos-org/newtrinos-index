id: qes-archive
type: collection
title: Quasielastic Electron Nucleus Scattering Archive (UVA, Benhar–Day–Sick)
short: 'Quasielastic electron–nucleus scattering archive (Benhar, Day, Sick): ~19 000 (e,e'') points for ν-interaction modelling'
description: Compilation of radiatively corrected inclusive (e,e') quasielastic cross sections, ~600 target/energy/angle combinations and ~19,000 points, for nuclei from 2H to 238U; plain text 8-column files (Z, A, E, theta, nu, sigma, error, citation) per target plus PDF plots. Standard benchmark for neutrino-nucleus QE/2p2h models.
