id: borexino-open-data
type: collection
title: Borexino open data (figure data, spectra, MC spectral shapes)
short: "Borexino website data: Phase II/III spectra, fit components, likelihood profiles and MC PDFs of signals and backgrounds"
description: |-
  Data files published by the Borexino collaboration on its web site alongside papers: the TFC-subtracted Phase-III
  spectrum with the best fit (PRL 129, 252701), Nature 2018 Phase-II figures (spectra, P_ee, correlations),
  CNO likelihood profiles and Monte Carlo spectral shapes of signals and backgrounds (open data of arXiv:2005.12829).
url_landing: "https://borex.lngs.infn.it/"
