card:
  summary: "The public pieces of Borexino's spectral analyses."
  intended_use: "Spectral fits of solar ν rates (pp, ⁷Be, pep, CNO) with Borexino's MC shapes."
  out_of_scope_use: "Full reproduction of the multivariate fits: the TFC-tagged spectrum and radial distributions are not public."
