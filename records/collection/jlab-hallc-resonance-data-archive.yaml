id: jlab-hallc-resonance-data-archive
type: collection
title: JLab Hall C Resonance Data Archive (inclusive e-p / e-d resonance-region data) and DIS data archive
short: JLab Hall C archive of resonance-region inclusive electron-scattering data and fits
description: Hampton U./Hall C archive of global resonance-region inclusive electron scattering datasets (elastic e-p, hydrogen, deuterium) organised by lab and experiment, plus fit-code tarballs (Christy-Bosted F1F209, sftm) and the E99-118 low-Q2 DIS L/T-separated H/D data archive. Key input for neutrino resonance/SIS (Bodek-Yang-like) modelling.
