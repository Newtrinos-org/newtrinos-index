id: double-chooz-2012-data-release
type: dataset
title: Double Chooz data release for 'Reactor electron antineutrino disappearance in the Double Chooz experiment' (DC 2nd publication)
short: 'Double Chooz 2012 data release: spectra, backgrounds and covariance (arXiv:1207.6632; archived)'
description: 'Supplement to the paper: prompt-energy spectra for two integration periods (36 bins of 0.5 MeV) as text vectors — data, best-fit signal, no-oscillation prediction, Li-9, fast-neutron/stopping-muon and accidental backgrounds, bin boundaries — plus systematic and total covariance matrices (TMatrixD in a ROOT file) and a fitter package (DC_Data_Release_Fitter.tar.gz) to reproduce the oscillation fit (best fit sin²2θ13 = 0.109, Δm² = 2.32e-3 eV²).'
