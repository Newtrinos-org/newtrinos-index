id: nova-antinumu-cc-pi0
type: dataset
title: NOvA numubar CC pi0 data for FERMILAB-PUB-25-0813-PPD
short: NOvA ν̄μ CC π⁰ production data (FERMILAB-PUB-25-0813-PPD)
description: 'Data release for the NOvA muon antineutrino charged-current (CC) pi^0 cross section presented in FERMILAB-PUB-25-0813-PPD.

  The signal for this analysis is defined as muon antineutrino CC interactions in the fiducial volume of the NOvA near detector (a 2.7 m × 2.7 m × 9.0 m region) that produce at least one pi^0 in the final state emerging from the nucleus, within the phase space of muon momentum [0.5, 2.5) GeV/c and muon angle [0, 60) degree.

  The README provides a detailed description of the contents of the data release, as per FERMILAB-PUB-25-0813-PPD.

  https://inspirehep.net/literature/3081601'
