id: hepdata-minerva-antinumu-cc-pi0
type: dataset
title: Single neutral pion production by charged-current $\bar{\nu}_\mu$ interactions on hydrocarbon at $\langle E_\nu \rangle = $ 3.6 GeV
short: 'HEPData: MINERvA single π⁰ production in CC ν̄μ interactions on hydrocarbon'
description: Fermilab-NuMI. Single neutral pion production via muon antineutrino charged-current interactions in plastic scintillator (CH) is studied using the MINERvA detector exposed to the NuMI low-energy, wideband antineutrino beam at Fermilab. Measurement of this process constrains models of neutral pion production in nuclei, which is important because the neutral-current analog is a background for $\bar{\nu}_e$ appearance oscillation experiments. The differential cross sections for $\pi^0$ momentum and production angle, for events with a single observed $\pi^0$ and no charged pions, are presented and compared to model predictions. These results comprise the first measurement of the $\pi^0$ kinematics for this process.
