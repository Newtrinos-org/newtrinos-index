id: hepdata-chorus-lambda-c
type: dataset
title: 'HEPData: Measurement of Lambda/c+ production in neutrino charged-current interactions.'
short: 'HEPData: CHORUS Λc⁺ production in neutrino CC interactions'
description: A measurement of Λ c + production in neutrino nucleon charged-current interactions is presented. In a subsample of about 50 000 interactions located in the emulsion target of the CHORUS detector, exposed to the wide band neutrino beam of the CERN SPS, candidates for decays of short-lived particles were identified using new automatic scanning systems and later confirmed through visual inspection. Criteria based on the flight length allowed a statistical separation among the different charm species thus enabling a sample particularly rich in Λ c + to be defined. At an average neutrino energy of 27 GeV, the product σ (Λ c + )/ σ (CC)× BR (Λ c + →3 p ) was measured to be (0.37±0.10(stat)±0.02(syst))×10 −2 , while the values of (1.54±0.35(stat)±0.18(syst))×10 −2 and of 0.24±0.07(stat)±0.04(syst) were obtained for σ (Λ c + )/ σ (CC) and BR (Λ c + →3 p ), respectively.
