id: hepdata-t2k-ccqe-carbon
type: dataset
title: Measurement of the $\nu_\mu$ CCQE cross section on carbon with the ND280 detector at T2K
short: 'HEPData: T2K ND280 νμ CCQE cross section on carbon'
description: 'KEK. The Charged-Current Quasi-Elastic (CCQE) interaction, $\nu_{l} + n \rightarrow l^{-} + p$, is the dominant CC process at $E_\nu \sim 1$ GeV and contributes to the signal in accelerator-based long-baseline neutrino oscillation experiments operating at intermediate neutrino energies. This paper reports a measurement by the T2K experiment of the $\nu_{\mu}$ CCQE cross section on a carbon target with the off-axis detector based on the observed distribution of muon momentum ($p_\mu$) and angle with respect to the incident neutrino beam ($\theta_\mu$). The flux-integrated CCQE cross section was measured to be $(0.83 \pm 0.12) \times 10^{-38}\textrm{ cm}^{2}$ in good agreement with NEUT MC value of ${0.88 \times 10^{-38}} \textrm{ cm}^{2}$. The energy dependence of the CCQE cross section is also reported.

  Data points taken from attached tar file available at http://t2k-experiment.org/results/.'
