id: hepdata-nomad-dstar-production
type: dataset
title: Study of D*+ production in nu/mu charged current interactions in the NOMAD experiment.
short: 'HEPData: NOMAD D*⁺ production in νμ CC interactions'
description: CERN-SPS. Study of charged D* meson production in neutrino charged current interactions. The D*+ yield per CC rate is measured together with distributions and mean values of the Feynman X scaling variable (XL), the transverse momenta (PT) and the production of the total hadronic jet energy carried by the D*+- (Z). Numerical values supplied by F. Juget.
