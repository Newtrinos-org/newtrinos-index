id: hepdata-microboone-nc-delta-radiative
type: dataset
title: Enhanced Search for Neutral Current $\Delta$ Radiative Single-Photon Production in MicroBooNE
short: 'HEPData: MicroBooNE enhanced search for NC Δ radiative single-photon production'
description: Data release for Enhanced Search for Neutral Current $\Delta$ Radiative Single-Photon Production in MicroBooNE. https://arxiv.org/abs/2502.05750. We report results from an updated search for neutral current (NC) resonant $\Delta$(1232) baryon production and subsequent $\Delta$ radiative decay (NC $\Delta\rightarrow N \gamma$). We consider events with and without final state protons; events with a proton can be compared with the kinematics of a $\Delta(1232)$ baryon decay, while events without a visible proton represent a more generic phase space. In order to maximize sensitivity to each topology, we simultaneously make use of two different reconstruction paradigms, Pandora and Wire-Cell, which have complementary strengths, and select mostly orthogonal sets of events. Considering an overall scaling of the NC $\Delta\rightarrow N \gamma$ rate as an explanation of the MiniBooNE anomaly, our data exclude this hypothesis at 94.4% CL. When we decouple the expected correlations between NC $\Delta\rightarrow N \gamma$ events with and without final state protons, and allow independent scaling of both types of events, our data exclude explanations in which excess events have associated protons, and do not exclude explanations in which excess events have no associated protons. Example code using this data release is available at https://github.com/eyandel/microboone-data-release.
