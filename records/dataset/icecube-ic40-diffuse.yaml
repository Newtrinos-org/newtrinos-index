id: icecube-ic40-diffuse
type: dataset
title: 'IceCube-40 String Data: Searching for a Diffuse Flux of Astrophysical Muon Neutrinos'
short: 'IceCube-40 search for a diffuse astrophysical νμ flux: data'
description: One of the main strategies used to look for astrophysical neutrinos with IceCube is the search for a diffuse flux of high-energy neutrinos from unresolved sources. A search was performed using data from the IceCube detector collected in its half completed configuration in which 40 strings operated between April 2008 and May 2009. 12,877 candidate neutrino events were obtained from this data sample.
