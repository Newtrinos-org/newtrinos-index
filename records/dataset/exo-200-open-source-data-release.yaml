id: exo-200-open-source-data-release
type: dataset
title: EXO-200 Open Source Data Release for AI/ML Applications
short: EXO-200 open-source waveform data release for AI/ML
description: The enclosed data release consists of a subset of the Th-228 calibration data from the EXO-200 experiment. Each event is provided in HDF5 format and includes raw waveforms and reconstructed event quantities, such as charge energy, light energy, rotated energy, and charge-cluster information. This release is specifically designed to support the training and testing of artificial intelligence and machine learning (AI/ML) algorithms.
