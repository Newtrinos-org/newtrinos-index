id: hepdata-charm-cc-differential
type: dataset
title: 'HEPData: Experimental Study of Differential Cross-sections in Charged Current Neutrino and Anti-neutrinos Interactions'
short: 'HEPData: CHARM differential CC ν and ν̄ cross sections'
description: Inclusive neutrino and antineutrino charged-current interactions were studied using the electronic detector of the CHARM Collaboration exposed to the narrow-band beam of the CERN SPS. The relative contributions of quarks and antiquarks to the neutrino cross sections were deduced from the differential cross sectionsdσ/d y . The x and Q 2 dependence of the structure functions F 2 and F 3 were measured. Scaling violations were observed, in qualitative agreement with QCD. A value of the mass scale parameter of QCD,Λ = [0.29 ± 0.12 (stat.) ± 0.10 (syst.)] GeV, was deduced in a leading-order approximation, following the method of Buras and Gaemers.
