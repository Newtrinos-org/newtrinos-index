id: coherent-csi-2021-data-release
type: dataset
title: COHERENT CsI[Na] data release (full exposure)
short: 'COHERENT CsI[Na]: beam-on/anti-coincidence events, backgrounds, efficiencies, quenching and SNS flux tables'
description: 'Data release accompanying the COHERENT measurement of the CEvNS cross section on CsI with the full CsI[Na] exposure (Phys. Rev. Lett. 129, 081801): coincidence and anti-coincidence event lists, beam-related neutron and NIN background PDFs, efficiency and scintillation-response coefficients, and the SNS neutrino flux in energy and time.'
