id: icecube-kaggle-neutrinos-in-deep-ice
type: dataset
title: "IceCube – Neutrinos in Deep Ice (Kaggle competition data)"
short: "IceCube Kaggle challenge (2023): simulated events (pulses per sensor) with true directions, for ML reconstruction"
description: |-
  Data of the public Kaggle competition "IceCube – Neutrinos in Deep Ice" (2023), organised by the IceCube
  Collaboration: simulated neutrino events as lists of pulses (sensor, time, charge) with the sensor geometry and the
  true neutrino direction, for the task of reconstructing the arrival direction with machine-learning methods. One of
  the largest public neutrino-telescope simulation samples and a standard benchmark for ML reconstruction.
