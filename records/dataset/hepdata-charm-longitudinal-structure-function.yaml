id: hepdata-charm-longitudinal-structure-function
type: dataset
title: 'HEPData: Experimental Study of the Nucleon Longitudinal Structure Function in Charged Current Neutrino and Anti-neutrinos Interactions'
short: 'HEPData: CHARM nucleon longitudinal structure function F_L'
description: The x dependence of the longitudinal structure function F L was determined with the CHARM neutrino detector exposed to neutrino and antineutrino wide-band beams of the CERN 400 GeV SPS. The results show a clear deviation from the Callan-Gross relation. The amount and the x dependence of this deviation are in agreement with the contribution coming from a finite transverse momentum of the partons in the nucleon if both the intrinsc and perturbative QCD terms are taken into account.
