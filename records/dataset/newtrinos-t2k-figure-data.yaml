card:
  provenance: Extracted from the arXiv sources of 2303.03222 and 2506.05889 and the 2025 release PDFs with the scripts in the same folder (vector paths where available).
  validation: Checked against the published numbers / curves in the verification entries listed above.
  known_limitations: Digitisation, not an official release; precision limited by the figure. The μ-like event figure covers E_rec < 3 GeV only; the (sin²θ23, Δm²32) contour figure is a raster image (digitised by colour, less precise). Per-mode totals match the release legends to ≤0.3 %.
