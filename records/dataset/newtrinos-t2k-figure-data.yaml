id: newtrinos-t2k-figure-data
type: dataset
title: T2K far-detector events, predictions and official contours extracted from figures (2023, 2025)
short: 'T2K: far-detector events, per-mode predictions (2025 release PDFs), CC1π⁺ data and official Δχ²/contours, extracted'
description: Event-by-event far-detector kinematics from arXiv:2303.03222 (vector markers), per-sample / per-mode predictions from the vector PDFs of the 2025 release, the νμ CC1π⁺ data, and the official Δχ²(δCP) and (sin²θ23, Δm²32) contours of arXiv:2506.05889. Digitised / vector-extracted by the Newtrinos developers from published figures; scripts alongside the data.
