id: hepdata-nutev-dimuon-cross-sections
type: dataset
title: 'HEPData: Precise measurement of dimuon production cross-sections in nu/mu Fe and anti-nu/mu Fe deep inelastic scattering at the Tevatron.'
short: 'HEPData: NuTeV dimuon production cross sections in ν/ν̄ Fe DIS'
description: We present measurements of the semi-inclusive cross sections for νμ- and ν¯μ-nucleon deep inelastic scattering interactions with two oppositely charged muons in the final state. These events dominantly arise from the production of a charm quark during the scattering process. The measurement was obtained from the analysis of 5102 νμ-induced and 1458 ν¯μ-induced events collected with the NuTeV detector exposed to a sign-selected beam at the Fermilab Tevatron. We also extract a cross-section measurement from a reanalysis of 5030 νμ-induced and 1060 ν¯μ-induced events collected from the exposure of the same detector to a quad-triplet beam by the Chicago Columbia Fermilab Rochester (CCFR) experiment. The results are combined to obtain the most statistically precise measurement of neutrino-induced dimuon production cross sections to date. These measurements should be of broad use to phenomenologists interested in the dynamics of charm production, the strangeness content of the nucleon, and the Cabibbo-Kobayashi-Maskawa matrix element Vcd.
