id: exo-200-public-data-ai-ml
type: dataset
title: EXO-200 Public Data Release for AI/ML Applications
short: EXO-200 public data release for AI/ML applications
description: 'The enclosed data release consists of a subset of the Th-228 calibration data from the EXO-200 experiment. Each event is provided in HDF5 format and includes raw waveforms and reconstructed event quantities, such as charge energy, light energy, rotated energy, and charge-cluster information. This release is specifically designed to support the training and testing of artificial intelligence and machine learning (AI/ML) algorithms.  Please read the following arXiv posting before using this dataset: https://arxiv.org/abs/2609.34304. Please direct questions about the material provided within this release to liyang@ucsd.edu (L. Yang).'
