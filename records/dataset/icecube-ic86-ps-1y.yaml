title: Search for point sources with first year of IC86 data
short: 'IceCube point-source search with the first IC86 year: data'
description: IceCube performed a search for point-like sources of neutrinos using four years of IceCube data, including the first year of data from the completed 86-string detector, taken between May 2011 and May 2012. This release includes only data from the first year of data-taking with the full IC86 configuration.
