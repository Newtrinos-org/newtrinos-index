id: icecube-spectral-break-2026
type: dataset
title: Data release for the paper "Evidence for a Spectral Break or Curvature in the Spectrum of Astrophysical Neutrinos from 5 TeV–10 PeV"
short: 'IceCube evidence for a spectral break or curvature in the astrophysical neutrino spectrum: data release'
description: 'This data release accompanies the paper describing the spectral break we measure with IceCube with two analyses: MESE analysis (using staring events) and Combined Fit analysis (using cascades and tracks samples). Data points to reproduce the plots in the paper are included here, along with a script to reproduce the plots.'
