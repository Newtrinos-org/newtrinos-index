id: newtrinos-sk-solar-dn-amplitude
type: dataset
title: Super-K solar day/night amplitude A_DN vs Δm²21, extracted from PRD 109, 092001
short: Super-K SK-IV and SK-I–IV day/night amplitude-fit curves A_DN(Δm²21), vector-extracted
description: The day/night asymmetry from SK's amplitude fit as a function of Δm²21 for SK-IV and for SK-I–IV combined; the amplitude fit is what drives the solar–KamLAND Δm²21 comparison. Digitised / vector-extracted by the Newtrinos developers from published figures; scripts alongside the data.
