id: pmt-response-water-cherenkov-wcsim
type: dataset
title: PMT response data of water Cherenkov using Geant4 simulation
short: Geant4 / WCSim simulation of PMT responses in a water Cherenkov detector
description: 'The content of the article is simulation related, therefore all data files are simulation level data and do not include real experimental dataThe data comes from the running results of the WCSim package, which only modified the detector configuration. The optical properties of water and the response properties of pmt were only based on the software default configuration, and no additional adjustments were made for possible application scenarios.The operation of the file should be based on the universal program Root in the field of particle physics: https://root.cern.chSpecific file content and description:• WCSimConstructMysphere.cc: Geometric construction information of spherical detectors• wcsim4_10.root: Simulation results of neutrinos at 4-10MeV• wcsim40k.root: Simulation results of 40K background• output.txt: Neutrino signal reconstruction result set used for reconstructing source direction• getrandom.C: A tool for generating background signal mixed pseudodata'
