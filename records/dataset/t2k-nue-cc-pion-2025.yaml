title: Data release for the "First Measurement of the Electron Neutrino Charged-Current Pion Production Cross Section on Carbon with the T2K Near Detector"
short: 'T2K first νe CC pion-production cross section: data release'
description: 'This is the data release for the "First Measurement of the Electron Neutrino Charged-Current Pion Production Cross Section on Carbon with the T2K Near Detector".It paper is published in Phsical Review Letters and is also available on the arXiv:2505.00516 [hep-ex].

  The tarball contains three files with the following columns in order:

  The cross section results file xsec.csv (bin | p_e1 | p_e2 | costheta_e1 | costheta_e2 | p_pi1 | p_pi2 | xsec)

  The cross section result covariance matrix file cov.csv (bin1 | bin2 | cov)

  The flux file flux.csv (bin | E_1 | E_2 | flux_nue_best_fit | flux_nue_nominal)'
