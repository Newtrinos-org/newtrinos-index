id: vhe-gamma-counterparts-icecube-alerts
type: dataset
title: Data for Prompt Searches for Very-High-Energy γ-Ray Counterparts to IceCube Astrophysical Neutrino Alerts
short: 'VHE γ-ray follow-up of IceCube alerts: SEDs and upper limits (Jin, Schüssler et al.)'
description: 'This dataset provides the multi-instrument spectral energy distribution (SED) data and upper limits corresponding to Figures 3–7 of the paper “Prompt Searches for Very-High-Energy γ-Ray Counterparts to IceCube Astrophysical Neutrino Alerts.”All data are stored in Enhanced Character-Separated Values (ECSV) format.


  🔹 General Format


  File type: .ecsv (plain text, comma-delimited)


  Standard: Astropy ECSV 0.9–2.0


  Delimiter: ,


  Encoding: UTF-8


  Purpose: Each file lists the energy-binned SED points or upper limits for a given source.


  Units: Explicitly stated in the header of each file.


  🔹 Column Definitions (common across files)


  Column name

  Unit

  Type

  Description


  srcname

  —

  string

  Source or neutrino-event identifier


  en

  eV or keV

  float

  Bin center energy


  en_wlo, en_wup

  same as en

  float

  Lower and upper bin half-widths


  nufnu

  erg cm⁻² s⁻¹

  float

  Differential photon flux at bin center


  nufnu_elo, nufnu_eup

  erg cm⁻² s⁻¹

  float

  Lower and upper statistical uncertainties in nufnu


  dnde

  TeV⁻¹ cm⁻² s⁻¹

  float

  Differential photon flux ($dN/dE$), when used instead of nufnu


  dnde_elo, dnde_eup

  TeV⁻¹ cm⁻² s⁻¹

  float

  Lower and upper uncertainty in dnde


  tstart, tstop

  MJD

  float

  Start and stop times of the observation


  texpo

  s or h

  float

  Effective exposure time


  instrument

  —

  string

  Instrument or combined instruments used


  dataformat

  —

  string

  “ul” = upper limit; “flux” = measured flux


  comments

  —

  string

  Additional notes (e.g. confidence level, campaign, etc.)'
