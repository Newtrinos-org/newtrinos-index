id: icecube-combined-diffuse-2015
type: dataset
title: A combined maximum-likelihood analysis of the astrophysical neutrino flux
short: 'IceCube combined maximum-likelihood analysis of the astrophysical flux: data'
description: The IceCube Collaboration revisited six previous studies investigating the nature of the astrophysical neutrino flux in a combined maximum-likelihood analysis that used up to three observables—energy, zenith angle and event topology—to derive improved constraints on the energy spectrum and the composition of neutrino flavors (νe , νμ , ντ) of the astrophysical neutrino flux.
