id: pks0215-vlba-neutrino-coincidence
type: dataset
title: Rapid jet ejection from PKS 0215+015 coincident with a high-energy neutrino event - VLBA BE082 data
short: VLBA data of the PKS 0215+015 jet ejection coincident with a high-energy neutrino
description: 'This repository contains the VLBA data presented in Eppel et al. (2026) "Rapid jet ejection from PKS 0215+015 coincident with a high-energy neutrino event"


  Self-calibrated .uvf files are located in the "uvf_files" folder."clean_windows" includes all .win files used for the final cleaning"fits_images" includes all Stokes I images"fits_images_q" includes all Stokes Q images"fits_images_u" includes all Stokes U images"stacked_fits_maps" includes full polarization stacked maps for 15, 24 and 43 GHz"model_mod_files" includes all .mod files readable with DIFMAP (or plain text editor).'
