id: t2k-cc0pi0p-water-hydrocarbon-antinu
type: dataset
title: Data release for "Measurements of muon-antineutrino and muon-neutrino+muon-antineutrino charged-current cross-sections without detected pions nor protons on water and hydrocarbon at mean antineutrino energy of 0.86 GeV"
short: 'T2K ν̄μ and νμ+ν̄μ CC cross sections without pions and protons on water and hydrocarbon: data release'
description: 'This data release is associated with the publication "Measurement of charged-current cross-sections on water and hydrocarbon without detected pions nor protons using the T2K anti-neutrino beam at an off-axis angle 1.5 degrees". It is available in Progress of Theoretical and Experimental Physics and arXiv:2004.13989 [hep-ex].The data release contains:


  The "histograms.root" file contains several histograms related to the cross-sections.


  flux_numubar_* -> 1D histogram with the flux prediction at the WAGASCI module or the Proton Module of the T2K experiment.


  flux_numu_* -> 1D histogram with the flux prediction at the WAGASCI module or the Proton Module of the T2K experiment.


  Err_numubar_* -> 1D TGraphAsymmErrors with the measured flux-integrated numubar cross-sections and their uncertainties.


  Err_numu_numubar_* -> 1D TGraphAsymmErrors with the measured flux-integrated numu+numubar cross-sections and their uncertainties.


  xsec_numubar_* -> 1D histogram with the predicted flux-integrated numubar cross-sections by NEUT (5.3.3).


  xsec_numu_numubar_* -> 1D histogram with the predicted flux-integrated numu+numubar cross-sections by NEUT (5.3.3).


  The "Covariance_Matrix_Numubar.root" file contains the covariance matrix for the flux-integrated numubar cross-sections, considering all the uncertainties.


  The "Covariance_Matrix_Numu+Numubar.root" file contains the covariance matrix for the flux-integrated numu+numubar cross-sections, considering all the uncertainties.


  The "flux" file contains the (anti-)muon neutrino flux prediction at the WAGASCI module or the Proton Module of the T2K experiment'
