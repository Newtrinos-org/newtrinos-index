title: 'IceCube-59: Search for point sources using muon events'
short: 'IceCube-59 point-source search with muon events: data'
description: A search for neutrino point sources using 3 years of IceCube data, including the 59-string configuration (May 2009 - May 2010), was performed. An all-sky scan was performed to look for spatial clustering of a fitting for the flux level and the spectral index.
