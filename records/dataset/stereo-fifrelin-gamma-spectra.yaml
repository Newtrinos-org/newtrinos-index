id: stereo-fifrelin-gamma-spectra
type: dataset
title: 'Data from: Improved STEREO simulation with a new gamma ray spectrum of excited gadolinium isotopes using FIFRELIN'
short: 'STEREO simulation with FIFRELIN γ spectra of excited Gd isotopes: supplemental files'
description: 'Supplemental material to the article “Improved STEREO simulation with a new gamma ray spectrum of excited gadolinium isotopes using FIFRELIN”


  The files available are aimed to simulate the de-excitation cascade following neutron capture on 155Gd and 157Gd. Therefore, the FIFRELIN simulation was done for the 156Gd and 158Gd isotopes, with the initial condition of an excitation energy of E* = Sn, the neutron separation energy.


  Please cite this publication when using the provided files:


  arXiv:1905.11967 [physics.ins-det]'
