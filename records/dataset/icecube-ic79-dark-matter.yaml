id: icecube-ic79-dark-matter
type: dataset
title: The 79-string IceCube search for dark matter
short: 'IceCube-79 search for dark matter: data'
description: Searches for high-energy neutrinos from the Sun are currently the most sensitive means of probing spin-dependent interactions between protons and most models for dark matter. In 2013, the IceCube Collaboration published the world's best limits on the spin-dependent cross section for weakly interacting dark matter particles. This is the data release accompanying this paper. We are also providing the nulike code, which allows to apply the new likelihood formalism to arbitrary dark matter models.
