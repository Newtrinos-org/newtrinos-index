id: t2k-flux-prediction-2013
type: dataset
title: Data release for "The T2K Neutrino Flux Prediction" (2013)
short: T2K neutrino flux prediction for ND280 and Super-K (2013 release, superseded)
description: This data release is superseded by the flux release in 2016.The files in the following archive file contain the neutrino beam flux predictions for the T2K ND280 (near) and Super-Kamiokande (far) detectors. The description of the flux predictions is published in Phys. Rev. D.87.012001 (arxiv.org:1211.0469 [hep-ex]). The provided flux predictions include no neutrino oscillations. This tar file contains the flux predictions as well as a README.pdf file with detailed information on the included files.
