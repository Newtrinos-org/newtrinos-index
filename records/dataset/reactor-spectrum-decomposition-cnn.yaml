id: reactor-spectrum-decomposition-cnn
type: dataset
title: The input data and output data of reactor neutrino spectrum decomposition using CNN
short: 'Reactor ν̄e spectrum decomposition with a CNN: input and output data (ROOT)'
description: 'The data is provided with ROOT file format. There are 6 items in the root file as following:1. fission contribution: isotope fission contribution status in one fuel cycle. It is corresponding to the top panel of Fig. 1 in the manuscript.2. weekly event rates: the weekly antineutrino event rates during the whole experiment operation. The figure is corresponding to the bottom panel of Fig. 1.3. the ratios of noiseless datasets: the ratio of decomposed U235, U238, Pu239 and Pu241 spectra from noiseless datasets to the truth spectra. The file folder contains distributions of the decomposition result for four fissile isotope in 24 energy bins ranging from 2 to 8 MeV. The top right statistic box of each figure indicates the decomposition sample number (Entries), the mean value (Mean) and their root mean square (RMS). In Fig. 4, the data points and error bars are corresponding to the Mean and RMS from statistic boxes, respectively.4. decomposed spectra from noiseless datasets: the decomposed U235, U238, Pu239 and Pu241 spectra from noiseless datasets. The file folder contains distributions of the decomposition result for four fissile isotope in 24 energy bins ranging from 2 to 8 MeV. The top right statistic box of each figure indicates the decomposition sample number (Entries), the mean value (Mean) and their root mean square (RMS).It is corresponding to the Fig. 4.5. the ratios of noisy datasets: the ratio of decomposed U235, U238, Pu239 and Pu241 spectra from noisy datasets to the truth spectra. The file folder contains distributions of the decomposition result for four fissile isotope in 24 energy bins ranging from 2 to 8 MeV. The top right statistic box of each figure indicates the decomposition sample number (Entries), the mean value (Mean) and their root mean square (RMS). In the bottom panel of Fig. 5, the data points and error bars are corresponding to the Mean and RMS from statistic boxes, respectively.6. decomposed spectra from noisy datasets: the decomposed U235, U238, Pu239 and Pu241 spectra from noiseless datasets. The file folder contains distributions of the decomposition result for four fissile isotope in 24 energy bins ranging from 2 to 8 MeV. The top right statistic box of each figure indicates the decomposition sample number (Entries), the mean value (Mean) and their root mean square (RMS). In the top panel of Fig. 5, the data points and error bars are corresponding to the Mean and RMS from statistic boxes, respectively.'
