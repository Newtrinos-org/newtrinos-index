id: hepdata-t2k-cc-ddiff-ch
type: dataset
title: Measurement of double-differential muon neutrino charged-current interactions on C$_8$H$_8$ without pions in the final state using the T2K off-axis beam
short: 'HEPData: T2K double-differential νμ CC interactions on hydrocarbon'
description: Numbers taken from http://t2k-experiment.org/wp-content/uploads/nd280data-numu-cc0pi-xs-on-c-2015.tar. Cross-section results as a function of muon momentum for different muon angular ranges. To get the total error you need to sum the three covariance matrices. The binning of the covariance matrices starts with the first momentum bin of the first $\cos\theta_\mu$ range and it loops over all the momentum bins of that range then it moves to the second angular range and so on.
