short: 'Super-K diffuse supernova neutrino background search (PRD 104, 122002): data release'
description: This is the data release for the PRD 104, 122002 article about the Diffuse Supernova Background search at Super-Kamiokande. The figures which can be reproduced with this release are listed in the README of the data_release folder. The spectral_analysis_npy.SKMC.tar.gz folder contains the files needed to reproduce the spectral analysis in section VII of the paper. To incorporate it to the spectral analysis code please follow the instructions given in the README of the spectral analysis Github folder.
