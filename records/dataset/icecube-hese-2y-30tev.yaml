id: icecube-hese-2y-30tev
type: dataset
title: Search for contained neutrino events at energies above 30 TeV in 2 years of data
short: IceCube contained events above 30 TeV in 2 years (first HESE sample)
description: 'Neutrino observations are a unique probe of the universe''s highest energy phenomena: neutrinos are able to escape from dense environments that photons cannot and are unambiguous tracers of hadronic interaction processes, in particular the acceleration of cosmic rays. We report on results of an all-sky search for these neutrinos at energies above 30 TeV in the cubic kilometer antarctic IceCube observatory between May 2010 and May 2012. The search follows up on the previous detection of two PeV neutrino events, with improved sensitivity and extended energy coverage down to approximately 30 TeV.'
