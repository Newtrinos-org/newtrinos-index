id: minerva-docdb-numi-flux-tables-2008
type: dataset
title: MINERvA public DocDB NuMI flux tables (LE/ME, neutrino and antineutrino, He-filled decay pipe), 2007-2008
short: MINERvA public DocDB NuMI flux tables (2007–08; historical, superseded)
description: 'Two public DocDB documents by L. Loiacono: MINERvA-doc-2004-v3 ''Updated MINERvA Neutrino Flux Files with He in the Decay Pipe'' and MINERvA-doc-3042-v1 ''MINERvA ANTI-neutrino flux files for the LE and ME Beams''; .dat tables per flavour (νμ, ν̄μ, νe, ν̄e, all) in 0.2 GeV bins, normalised per GeV/m² per 4e20 POT (LE), 12e20 POT (ME) or 16e20 POT (combined), plus an LE:ME composition spreadsheet.'
