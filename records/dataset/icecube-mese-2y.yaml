id: icecube-mese-2y
type: dataset
title: Search for contained neutrino events at energies greater than 1 TeV in 2 years of data
short: IceCube contained events above 1 TeV in 2 years (MESE)
description: The IceCube Neutrino Observatory was designed primarily to search for high-energy (TeV--PeV) neutrinos produced in distant astrophysical objects. Here we present the results of a search for neutrino interactions inside IceCube's instrumented volume between 1 TeV and 1 PeV in 641 days of data taken from 2010--2012. From these data we derive new constraints on the diffuse astrophysical neutrino spectrum,as well as the strongest upper limit yet on the flux of neutrinos from charmed-meson decay in the atmosphere.
