id: icecube-northern-numu-2y
type: dataset
title: Astrophysical muon neutrino flux in the northern sky with 2 years of IceCube data
short: 'IceCube astrophysical νμ flux in the northern sky, 2 years: data'
description: Results from the IceCube Neutrino Observatory have recently provided compelling evidence for the existence of a high energy astrophysical neutrino flux utilizing a dominantly Southern Hemisphere data set consisting primarily of νe and ντ charged-current and neutral-current (cascade) neutrino interactions. Additionally, a fit for an astrophysical flux with an arbitrary spectral index is performed.
