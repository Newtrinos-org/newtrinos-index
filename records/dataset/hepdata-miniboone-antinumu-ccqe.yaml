id: hepdata-miniboone-antinumu-ccqe
type: dataset
title: First Measurement of the Muon Anti-Neutrino Double-Differential Charged Current Quasi-Elastic Cross Section
short: 'HEPData: MiniBooNE ν̄μ double-differential CCQE cross section'
description: The largest sample ever recorded of $\bar{\nu}_\mu$ charged-current quasielastic (CCQE, $\bar{\nu}_\mu p \to \mu^{+} n$) candidate events is used to produce the minimally model-dependent, flux-integrated double-differential cross section $\frac{d^{2}\sigma}{dT_\mu d\textrm{cos}\, \theta_\mu}$ for $\bar{\nu}_\mu$ CCQE for a mineral oil target. This measurement exploits the large statistics of the MiniBooNE antineutrino-mode sample and provides the most complete information of this process to date. In order to facilitate historical comparisons, the flux-unfolded total cross section and single-differential cross section on both mineral oil and on carbon are also reported. Numbers are taken from the MiniBooNE Data Release (http://www-boone.fnal.gov/for_physicists/data_release/ccqe_nubar/).
