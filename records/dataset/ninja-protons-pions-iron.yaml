title: Data release for the paper "Measurements of protons and charged pions emitted from the $\nu_{\mu}$ charged-current interactions on iron at a mean neutrino energy of 1.49 GeV using a nuclear emulsion detector"
short: 'NINJA emulsion detector: protons and charged pions from νμ CC interactions on iron'
description: 'This data release is associated with the paper "Measurements of protons and charged pions emitted from the \(\nu_{\mu}\) charged-current interactions on iron at a mean neutrino energy of 1.49 GeV using a nuclear emulsion detector". It is currently available on arXiv:2203.08367 and to be submitted to Phys. Rev. D. When citing this data release, please cite as well the paper. The provided zip file contains the data as below. event.root: Event by event information of 183 iron-target interactions. plot.root: Plot information as shown in the paper. detector_efficiency.root: Detectrion efficiencies for muons, charged pions, and protons. momentum_resolution.root: Relation between true and reconstructed momentum for muons, charged pions, and protons. misPID.root: Mis-PID rates of protons and pions. syscov.root: Covariance matrices of systematic uncertainties. flux.root: The neutrino flux and the covariance matrix of the flux error. The zip file also contains a README.pdf file with detailed information on the included files. Please read it.'
