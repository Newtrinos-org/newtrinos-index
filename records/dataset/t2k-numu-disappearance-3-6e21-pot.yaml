id: t2k-numu-disappearance-3-6e21-pot
type: dataset
title: Data release for "Updated T2K measurements of muon neutrino and antineutrino disappearance using 3.6E21 protons on target"
short: 'T2K νμ / ν̄μ disappearance with 3.6×10²¹ POT: data release'
description: 'This data release accompanies the results of T2K''s analysis of muon neutrino and antineutrino oscillation data collected between 2010 and 2020. The file format is ROOT and contains the best-fit point and the 68% and 90% confidence level contours in the oscillation parameters space investigated by the analysis. The results for both mass ordering are included. Each entry in the file is a TGraph described in DataReleaseNuMuAntiNuMuDis.pdf.


  This is in Physical Review D and available on the arXiv:2305.09916 [hep-ex].'
