id: icecube-umd-open-data-pilot
type: dataset
title: 'IceCube Open Data Format pilot (UMD): calibrated photo-electron level events and Python tools'
short: 'IceCube open data format pilot (UMD): calibrated event samples and Python tools'
description: 'IceCube ''Public Data Project'' under Data Release Set 2 of the IceCube open-data policy: calibrated IC86 events without reconstruction (run, trigger time/type, photo-electron charge, DOM position, time) in a documented binary bytestream (''.odf''), with a large-NChannel sample (27 Apr 2013), a neutrino-enriched sample (run 121585, 10 Jan 2013), test data, a lightweight Python reader/event viewer, and per-season trigger/geometry documentation.'
