id: super-k-solar-i-iv-spectra
type: dataset
title: Super-Kamiokande solar ⁸B spectra, SK-I to SK-IV (paper tables)
short: Super-K solar ⁸B recoil-electron spectra per phase (day/night, stat/syst errors) from the SK-I…SK-IV paper appendices
description: Binned recoil-electron spectra of the four Super-K solar phases as printed in the papers (SK-I 1496 d, SK-II 791 d, SK-III 548 d, SK-IV 2970 d), with day/night and uncorrelated / correlated systematics. Newtrinos combines them with the per-phase systematics table of the SK-IV paper.
