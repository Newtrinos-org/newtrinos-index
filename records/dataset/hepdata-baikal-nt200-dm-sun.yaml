id: hepdata-baikal-nt200-dm-sun
type: dataset
title: Search for neutrino emission from relic dark matter in the Sun with the Baikal NT200 detector
short: 'HEPData: Baikal NT200 search for neutrinos from dark matter in the Sun'
description: BAIKAL. We have analyzed a data set taken over 2.76 years live time with the Baikal neutrino telescope NT200. The goal of the analysis is to search for neutrinos from dark matter annihilation in the center of the Sun. Apart from the conventional annihilation channels BOTTOM BOTTOMBAR, W+ W- and TAU+ TAU- we consider also the annihilation of dark matter particles into monochromatic neutrinos. From the absence of any excess of events from the direction of the Sun over the expected background, we derive 90% upper limits on the fluxes of muons and muon neutrinos from the Sun, as well as on the elastic cross sections of dark matter scattering on protons.
