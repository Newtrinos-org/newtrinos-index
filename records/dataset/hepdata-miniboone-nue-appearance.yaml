id: hepdata-miniboone-nue-appearance
type: dataset
title: A Search for electron neutrino appearance at the Delta m**2 ~ 1- eV**2 scale
short: 'HEPData: MiniBooNE search for νe appearance at Δm² ~ 1 eV²'
description: 'The MiniBooNE Collaboration reports first results of a search for $\nu_e$ appearance in a $\nu_\mu$ beam. With two largely independent analyses, we observe no significant excess of events above background for reconstructed neutrino energies above 475 MeV. The data are consistent with no oscillations within a two-neutrino appearance-only oscillation model.

  The data release is intended to enable the oscillation fit in two different energy ranges: the default energy range (475 MeV - 3000 MeV), and the low energy threshold range (300 MeV - 3000 MeV).

  Instructions on how to use the data release and an example FORTRAN program are provided in the additional resources.

  Files and numbers are taken from the MiniBooNE Data Release (http://www-boone.fnal.gov/for_physicists/data_release/nue/). Original data release files are available in the additional resources.'
