id: hepdata-nutev-diffractive-charm
type: dataset
title: 'HEPData: Evidence for diffractive charm production in nu/mu Fe and anti-nu/mu Fe scattering at the Tevatron.'
short: 'HEPData: NuTeV evidence for diffractive charm production in νμ/ν̄μ Fe'
description: We present evidence for the diffractive processes nu_mu Fe -> mu^- D_s^+ (D_s^*+) Fe and nubar_mu Fe -> mu^+ D_s^- (D_s^*-) Fe using the Fermilab SSQT neutrino beam and the Lab E neutrino detector. We observe the neutrino trident reactions nu_mu Fe -> nu_mu mu^- mu^+ Fe and nubar_mu Fe -> nubar_mu mu^+ mu^- Fe at rates consistent with Standard Model expectations. We see no evidence for neutral-current production of J/psi via either diffractive or deep inelastic scattering mechanisms.
