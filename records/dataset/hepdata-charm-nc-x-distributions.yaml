id: hepdata-charm-nc-x-distributions
type: dataset
title: 'HEPData: Experimental Study of X Distributions in Semileptonic Neutral Current Neutrino and Anti-neutrino Reactions'
short: 'HEPData: CHARM x distributions in semileptonic NC ν and ν̄ reactions'
description: Using the CHARM detector 36 000 deep inelastic neutral-current reactions of neutrinos (and 2000 of antineutrinos) from the 160 GeV narrow-band beam were recorded. The differential cross section d σ d x in the Bjorken scaling variable x was computed by unfolding the effects of limited acceptance and of resolution of the detector as well as the ambiguity of the energy of the incoming neutrinos (produced by π- or K-decay). Combining the results from the neutrino and antineutrino data, the structure functions F 2 and xF 3 and the antiquark momentum distribution measured via the NC coupling were determined. The distributions are in agreement with the corresponding CC distibutions. Comparisons with deep inelastic muon scattering confirm the universality of nuclear structure functions as probed by the weak and the electromagnetic currents.
