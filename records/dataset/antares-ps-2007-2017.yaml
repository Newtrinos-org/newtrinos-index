id: antares-ps-2007-2017
type: dataset
title: ANTARES 2007-2017 Point Source Analysis
short: ANTARES 2007–2017 point-source track sample with effective areas (KM3NeT Open Data)
description: 'This data set corresponds to the track sample (muon neutrino candidates) of a study meant to search for a point sources with data collected from January 2007 to December 2017 by the ANTARES neutrino telescope. Available are the effective area, the acceptance, the cumulative angular resolution distribution and the point spread function for an E-2 source spectrum. This sample encompasses the two previous released sets, with similar cuts. This increased lifetime amounts to 3125 days and to a total number of 8754 events. More information on how the search was performed can be found in: G. Illuminati for the ANTARES Collaboration, PoS(ICRC2019)920 and A. Albert et al., ApJL 863, L30 (2018)'
