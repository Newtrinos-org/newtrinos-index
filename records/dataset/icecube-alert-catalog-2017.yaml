title: IceCube catalog of alert events up through IceCube-170922A
short: IceCube catalogue of alert events up to IceCube-170922A
description: 'A high-energy neutrino event alert was issued by IceCube on 22 September 2017 and was found coincident in direction

  and time with a gamma-ray flare from the blazar TXS 0506+056. As part of the analysis of this multimessenger signal,

  all previous neutrinos that issued alerts within the realtime alert system (DOI:10.1016/j.astropartphys.2017.05.002), or would have since the 2010 operational season were also investigated for correlation with Fermi-LAT signals'
