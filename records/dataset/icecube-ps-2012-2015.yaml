id: icecube-ps-2012-2015
type: dataset
title: 'All-sky point-source IceCube data: years 2012-2015'
short: IceCube all-sky point-source events, 2012–2015
description: 'IceCube has performed a search for point-like sources of neutrinos using seven years of IceCube data, supplanting the previously available four year analysis. This data release provides tables of the effective area and point spread functions for the 2012-2015 through-going track events and for the 2010-2015 starting track events as well as the pre-trials local p-values for each point on the sky for the augmented complete sample.

  "All-sky Search for Time-integrated Neutrino Emission from Astrophysical Sources with

  7 yr of IceCube Data", IceCube Collaboration: M.G. Aartsen et al. Published in The

  Astrophysical Journal, 835 (2017) 151, doi: 10.3847/1538-4357/835/2/151'
