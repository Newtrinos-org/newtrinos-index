id: slats-lartpc-track-samples
type: dataset
title: Simple Liquid-Argon Track Samples (SLATS)
short: 'SLATS: simple liquid-argon track samples in two detector-response domains (ProtoDUNE-SP simulation)'
description: The data set we release here covers two data domains. Each domain is populated by a variant of a LArTPC detector simulation used in the ProtoDUNE-SP experiment. The two domains differ in one feature—the detector response function. The domain real is generated with a 2D response, and the fake domain is generated with a quasi-1D response. The dataset can be used to train unpaired image translation algorithms.
