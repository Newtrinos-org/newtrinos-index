id: icecube-oscillations-3y-2015
type: dataset
title: 'IceCube Oscillations: 3 years muon neutrino disappearance data'
short: IceCube DeepCore 3-year νμ disappearance data (2015 release)
description: In the 1990s, Super-Kamiokande’s measurements of atmospheric neutrinos led to the acceptance of the mass-induced oscillation model. As of today, the three mixing angles, the solar mass splitting and the absolute value of the atmospheric mass splitting that control the oscillation phenomenon have been measured. We present a measurement of neutrino oscillations via atmospheric muon neutrino disappearance with three years of data of the completed IceCube neutrino detector. DeepCore, a region of denser instrumentation, enables the detection and reconstruction of atmospheric muon neutrinos between 10 GeV and 100 GeV, where a strong disappearance signal is expected.
