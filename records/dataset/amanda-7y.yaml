id: amanda-7y
type: dataset
title: AMANDA 7 Year Data
short: AMANDA-II 7-year point-source event data
description: The Antarctic Muon And Neutrino Detector Array (AMANDA) is an optical Cherenkov detector consisting of 677 optical modules arranged in 19 strings frozen ~1.5 km -- ~2 km deep in the ice sheet at the geographic South Pole. Each optical module contains a 20 cm photomultiplier tube surrounded by a glass pressure sphere housing. Cherenkov light emitted by energetic particles inside the AMANDA volume is detected by the modules, and resulting PMT pulses are propagated to the surface and processed by trigger logic. AMANDA-II has operated from 2000 -- 2006 and has recorded 6595 upgoing events in 3.8 years of livetime during this period.
