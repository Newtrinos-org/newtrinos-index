id: majorana-demonstrator-ai-ml
type: dataset
title: Majorana Demonstrator Data Release for AI/ML Applications
short: Majorana Demonstrator waveform data release for AI/ML applications
description: 'The enclosed data release consists of a subset of the 228Th calibration data from the Majorana Demonstrator experiment. Each Majorana event is accompanied by raw Germanium detector waveforms, pulse shape discrimina- tion cuts, and calibrated final energies, all shared in an HDF5 file format along with relevant metadata. This release is specifically designed to support the training and testing of Artificial Intelligence and Machine Learning (AI/ML) algorithms upon our data. Please read the following ArXiV posting before using this dataset: https://arxiv.org/abs/2308.10856. Please direct questions about the material provided within this release to liaobo77@ucsd.edu (A. Li).'
