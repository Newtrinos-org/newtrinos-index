id: nova-2024-data-release
type: dataset
title: NOvA 2024 official data release (26.61E20 neutrino + 12.5E20 antineutrino)
short: "NOvA 10-year far-detector νμ / νe spectra with predicted components, as used in the 2024 three-flavour analysis"
description: |-
  Far-detector data and predictions of the NOvA 2024 three-flavour oscillation analysis (26.61×10²⁰ POT ν,
  12.5×10²⁰ POT ν̄): νμ disappearance in four resolution quartiles and νe appearance, FHC and RHC, with the predicted
  signal and background components and the official contours.
