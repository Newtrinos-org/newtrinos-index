id: icecube-ps-2008-2018-searches
type: dataset
title: IceCube Data for Neutrino Point-Source Searches Years 2008-2018
short: IceCube data for neutrino point-source searches, 2008–2018
description: IceCube has performed several all-sky searches for point-like neutrino sources using track-like events, including a recent time-integrated analysis using 10 years of IceCube data. This paper accompanies the public data release of these neutrino candidates detected by IceCube between April 6, 2008 and July 8, 2018. The selection includes through-going tracks, primarily due to muon neutrino candidates, that reach the detector from all directions, as well as neutrino track events that start within the instrumented volume. An updated selection and reconstruction for data taken after April 2012 slightly improves the sensitivity of the sample. While more than 80% of the sample overlaps between the old and new versions, differing events can lead to changes relative to the previous 7 year event selection. An a posteriori estimate of the significance of the 2014-2015 TXS flare is reported with an explanation of observed discrepancies with previous results. This public data release, which includes 10 years of data and binned detector response functions for muon neutrino signal events, shows improved sensitivity in generic time-integrated point source analyses and should be preferred over previous releases.
