id: icecube-sterile-1y
type: dataset
title: Search for sterile neutrinos with one year of IceCube data
short: 'IceCube 1-year search for eV-scale sterile neutrinos (IC86 2011): data and MC'
description: The IceCube neutrino telescope at the South Pole has measured the atmospheric muon neutrino spectrum as a function of zenith angle and energy to search for the oscillation signatures of light sterile neutrinos. The primary result of this search derives from the first year of data, taken during 2011, of the full 86-string IceCube configuration.
