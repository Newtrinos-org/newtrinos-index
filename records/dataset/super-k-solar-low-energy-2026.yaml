title: Data release for "Measurement of the solar neutrino interaction rate below 3.49 MeV in Super-Kamiokande-IV"
short: 'Super-K solar ν interaction rate below 3.49 MeV: data release'
description: 'This data release accompanies the article "Measurement of the solar neutrino interaction rate below 3.49 MeV in Super-Kamiokande-IV" published as Phys. Rev. D 113, 112001. It includes solar angle distributions for each selection bin and the fits to the electron neutrino survival probability as a function of neutrino energy.

  Solar Angle Distributions

  The solar angle distributions are given as 51 ROOT histograms in a single file, "solar_angle.root", which can be used to reproduce the solar angle distributions in Figures 5-8 and 11.The histogram names corresponding to the data begin with "data_" followed by the dataset name [WIT, SLE 34-hit period, SLE 31-hit period, Combined], the lower energy bound in electron kinetic energy, the upper energy bound, the lower multiple scattering goodness (MSG) bound, and the upper MSG bound.Distributions are provided in 2.49 MeV - 2.99 MeV and 2.99 MeV - 3.49 MeV for the WIT dataset and 2.99 MeV - 3.49 MeV for all others.While the plots in the paper use 25 bins, 200 finer bins are provided here to allow the user to choose the binning.

  Histograms beginning with "backshape" correspond to the data-driven fit to the background distribution ("background shape") according to the "scramble" method (see Section V).

