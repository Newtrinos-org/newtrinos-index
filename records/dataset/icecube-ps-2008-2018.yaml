id: icecube-ps-2008-2018
type: dataset
title: 'All-sky point-source IceCube data: years 2008-2018'
short: IceCube all-sky point-source events (10 years, 2008–2018) with effective areas and smearing
description: IceCube has performed several searches for point-like sources of neutrinos. The events contained in this release make up the sample used in IceCube's 10 year time-integrated neutrino point source search. Events in the sample are track-like neutrino candidates detected by IceCube between April 2008 and July 2008. Included are data events and instrument response functions from IceCube's 10 year full-sky point source sample.
