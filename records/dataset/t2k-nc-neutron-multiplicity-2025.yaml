id: t2k-nc-neutron-multiplicity-2025
type: dataset
title: Data release for "First neutron capture multiplicity measurement of neutrino-oxygen neutral-current quasi-elastic-like interactions using an accelerator neutrino beam"
short: 'T2K first neutron-capture multiplicity in ν–oxygen NC interactions: data release'
description: This archive contains a ROOT file and this README document, for which the ROOT file include the related prompt event and delayed signal features in neutral-current quasi-elastic (NCQE) neutrino interactions, which are used to conclude the measurements of mean neutron multiplicity. The results are based on Run 11, corresponding to Super-Kamiokande VI using a dedicated neutron detection algorithm, NTag.The paper is published in Physical Review D and is available on the arXiv:2505.22547 [hep-ex].
