id: icecube-deepcore-cnn-9-3y
type: dataset
title: Data release for neutrino oscillation parameters using convolutional neural networks with 9.3 years of data in IceCube DeepCore
short: 'IceCube DeepCore 9.3-year νμ disappearance with CNN reconstruction: data release'
description: Public data release from the IceCube collaboration for the result in arXiv:2405.02163 ("Measurement of atmospheric neutrino oscillation parameters using convolutional neural networks with 9.3 years of data in IceCube DeepCore"). This public dataset contains two \DeltaLLH maps of the oscillation parameters assuming normal and inverted ordering separately. The absolute difference between the best-fit points in the two orderings has been removed from this release. The details can be found in the README.
