id: icecube-hese-4y
type: dataset
title: Observation of Astrophysical Neutrinos in Four Years of IceCube Data
short: IceCube HESE 4-year sample (observation of astrophysical neutrinos)
description: The spectrum of cosmic rays includes the most energetic particles ever observed. The mechanism of their acceleration and their sources are, however, still mostly unknown. Observing astrophysical neutrinos can help solve this problem. This update extends the data-taking period by one more year to four years from 2010 to 2014 for a total livetime of 1347 days.
