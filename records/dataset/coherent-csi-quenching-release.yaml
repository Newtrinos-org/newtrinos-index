title: COHERENT Collaboration data release from the measurements of CsI[Na] response to nuclear recoils
short: 'COHERENT measurements of the CsI[Na] response to nuclear recoils: data release'
description: The data release from the measurements of the CsI[Na] response to low energy nuclear recoils by the COHERENT collaboration. The release corresponds to the results published in 'D. Akimov et al 2022 JINST 17 P10034.' We share the data in the form of raw ADC waveforms, provide benchmark subselections and event reconstruction scripts to enhance the transparency and reproducibility of our results.
