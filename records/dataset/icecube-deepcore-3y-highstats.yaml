id: icecube-deepcore-3y-highstats
type: dataset
title: IceCube 3 year high statistics neutrino oscillation samples
short: "IceCube DeepCore 2012–2015 oscillation samples A and B: binned MC, data and systematics prescriptions"
description: |-
  Public binned Monte Carlo and data of two three-year DeepCore event selections ("sample A" and "sample B"),
  close variants of the samples of the PRL 120, 071801 νμ-disappearance and PRD 99, 032007 ντ-appearance analyses,
  with instructions for detector systematics (ice absorption / scattering hyperplanes).
doi: 10.21234/ac23-ra43
url_landing: "https://icecube.wisc.edu/data-releases/2019/05/three-year-high-statistics-neutrino-oscillation-samples/"
