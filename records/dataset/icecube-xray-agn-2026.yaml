id: icecube-xray-agn-2026
type: dataset
title: 'Replication Data for: Evidence for Neutrino Emission from X-ray Bright Active Galactic Nuclei with IceCube'
short: 'IceCube evidence for neutrino emission from X-ray-bright AGN: replication data'
description: 'This data release accompanies the publication "Evidence for Neutrino Emission from X-ray Bright Active Galactic Nuclei with IceCube."

  It provides all data products and plotting scripts required to reproduce the five figures in the main text, as well as machine-readable versions of Tables 2 and 3 in the Appendix.

  In addition, we provide the 90% C.L. flux upper limits and the sensitive 68% C.L. energy range for Cygnus A, the 5th X-ray-bright AGN contributing to the reported 3.3-sigma binomial excess.

  A README file is included that details the contents of the release and provides instructions for reproducing each figure using the supplied Jupyter notebooks and data files.'
