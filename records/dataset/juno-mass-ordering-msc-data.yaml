id: juno-mass-ordering-msc-data
type: dataset
title: Supporting data for JUNO neutrino mass ordering sensitivity analysis
short: 'JUNO mass-ordering sensitivity (Master''s thesis): simulated spectra and outputs'
description: This dataset accompanies the Master’s dissertation “Computational Analysis of the JUNO Experiment’s Sensitivity to the Neutrino Mass Ordering”. It includes several NumPy .npy and .txt files with simulated energy spectra, metadata, and statistical analysis results, together with plots generated during the research and the Python .ipynb codes used to produce them. The data support sensitivity studies of the JUNO experiment to the Neutrino Mass Ordering and provide the basis for reproducing and extending the analyses presented in the dissertation.
