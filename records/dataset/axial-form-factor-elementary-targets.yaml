id: axial-form-factor-elementary-targets
type: dataset
title: 'The Nucleon Axial Form Factor from Elementary Target Data: supplemental files'
short: 'Nucleon axial form factor from elementary-target data: digitised deuterium and MINERvA H distributions'
description: Digitised event distributions vs E_nu (_E) and Q2 (_N) from historical deuterium bubble-chamber experiments, MINERvA 2023 antineutrino-hydrogen cross section, flux and covariance (CSV), plus a Python script for z-expansion axial form factor fits with up to 4 sum rules.
