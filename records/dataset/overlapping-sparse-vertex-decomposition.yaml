id: overlapping-sparse-vertex-decomposition
type: dataset
title: Datasets and model checkpoints for overlapping-sparse neutrino interaction decomposition
short: 'Deep-learning decomposition of overlapping-sparse images at neutrino vertices: datasets and checkpoints'
description: 'Datasets and model checkpoints corresponding to the article: "Deep-learning-based decomposition of overlapping-sparse images: application at the vertex of neutrino interactions." (https://arxiv.org/abs/2310.19695):


  dataset_p.tar.gz: proton dataset.

  dataset_mu.tar.gz: muon dataset.

  dataset_D+.tar.gz: deuterium dataset.

  dataset_T+.tar.gz: tritium dataset.

  metadata.tar.gz: datasets metadata.

  checkpoints.tar.gz: checkpoints for the trained neural network models.'
