id: newtrinos-kamland-2013-periods
type: dataset
title: KamLAND 2002–2012 per-period spectra, efficiency and geoneutrino shapes extracted from PRD 88, 033001
short: 'KamLAND 2013: prompt spectra for the three data-taking periods, efficiency and geo-ν shapes, vector-extracted'
description: Per-period prompt spectra (Fig. 3), selection efficiency (Fig. 3a) and geoneutrino spectral shapes (Fig. 6) of the 2013 KamLAND analysis; the reactor prediction in Newtrinos is computed from first principles instead. Digitised / vector-extracted by the Newtrinos developers from published figures; scripts alongside the data.
