id: hepdata-charm-nc-cc-cross-sections
type: dataset
title: 'HEPData: Experimental Study of Neutral Current and Charged Current Neutrino Cross-Sections'
short: 'HEPData: CHARM neutral- and charged-current neutrino cross sections'
description: Samples of 9200 muon-neutrino and 3800 muon-antineutrino interactions on nuclei were obtained with the fine-grain calorimeter of the CHARM Collaboration at the CERN 200 GeV narrow-band neutrino beam. The interactions were classified as either neutral-current or charged-current processes on an event-by-event basis. Neutral-current and charged-current cross sections in neutrino and antineutrino interactions are presented. From these results we deduce a statistically significant contribution of right-handed coupling to the neutral hadronic current, and a value of the electroweak mixing angle corresponding to sin 2 θ = 0.220 ± 0.014.
