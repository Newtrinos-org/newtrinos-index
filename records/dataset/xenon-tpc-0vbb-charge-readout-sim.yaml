id: xenon-tpc-0vbb-charge-readout-sim
type: dataset
title: Single-Phase Xenon TPC Charge Readout Simulation (Neutrinoless Double Beta Decay AI Summer School)
short: Single-phase xenon TPC charge-readout simulation of 100 000 double-beta events (HDF5)
description: 'Licensed under Lawrence Livermore National Laboratory, CP Number 2026-182.


  More on this data can be found at arXiv:2603.27005.This dataset (HDF5 files) contains a subset of 100,000 simulated double beta decay events as recorded by the charge collectors of a single-phase liquid xenon TPC, and a holdout validation set at the target decay energy. The simulation follows the approximate design specifications of the nEXO experiment, which seeks to measure neutrinoless double beta decay (0vBB). The charge collection portion of nEXO is comprised of square tiles embedded with electrodes, 16 by 16 channels in perpendicular to reconstruct charge signals into position information. Here, events are confined to a single tile. Thus, each recorded event is an array of 32 channels of 1D charge waveform data within a window of 1377 time steps in units of 0.5 microseconds. Single events will appear duplicated as both sets of perpendicular channels will record charge. Each event has a clean (“noiseless”) and noisy version, along with an energy value in MeV.'
