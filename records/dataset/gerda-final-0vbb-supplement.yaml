id: gerda-final-0vbb-supplement
type: dataset
title: Supplemental Material for "Final Results of GERDA on the Search for Neutrinoless Double-𝛽 Decay"
short: 'GERDA final 0νββ results: supplemental material'
description: 'This data set supplements "Final Results of GERDA on the Search for Neutrinoless Double-𝛽 Decay" and includes further information about the statistical analysis complementing what is provided in the in the Supplemental Material of the original publication.

  [gerda-event-list.csv] Table of events detected by GERDA in the [1930, 2160] keV HPGe energy range surviving all cuts.

  [gerda-partition-parameters.csv] Table of GERDA experimental parameters for each HPGe detector and each time period characterized by stable performance. The combined 0vbb acceptance incorporates all other acceptances and enrichment fractions, with uncertainties added in quadrature. energy_bias_in_keV is defined as the Q-value of double-beta decay (2039.06 keV) minus calibrated energy. See "Final Results of GERDA on the Search for Neutrinoless Double-𝛽 Decay" for more details about the definition of these parameters and how they are used in the likelihood function for the 0vbb analysis.'
