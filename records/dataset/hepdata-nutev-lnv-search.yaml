id: hepdata-nutev-lnv-search
type: dataset
title: 'HEPData: Search for the lepton number violating process anti-nu/mu e- --> mu- anti-nu/e.'
short: 'HEPData: NuTeV search for lepton-number-violating ν̄μ e⁻ → μ⁻ ν̄e'
description: The NuTeV experiment at Fermilab has used a sign-selected neutrino beam to perform a search for the lepton number violating process $\bar{\nu}_mu e^- \to \mu^- \bar{\nu}_e$, and to measure the cross-section of the Standard Model inverse muon decay process $\nu_{\mu} e^- \to \mu^- \nu_e$. NuTeV measures the inverse muon decay asymptotic cross-section $\sigma/E$ to be 13.8 $\pm$ 1.2 $\pm$ 1.4 x $10^{-42} cm^2$/GeV. The experiment also observes no evidence for lepton number violation and places one of the most restrictive limits on the LNV/IMD cross-section ratio at $\sigma (\bar{\nu}_{\mu} e^- \to \mu^- \bar{\nu}_e) /\sigma (\nu_{\mu}e^- \to \mu^- \nu_e$) $\le$ 1.7% at 90% C.L. for V-A couplings and $\le$ 0.6% for scalar couplings.
