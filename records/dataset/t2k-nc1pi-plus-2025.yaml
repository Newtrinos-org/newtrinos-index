id: t2k-nc1pi-plus-2025
type: dataset
title: Data Release for the "First differential measurement of the single positive pion production cross section in neutrino neutral-current scattering"
short: 'T2K first differential NC single-π⁺ cross section: data release'
description: This data release provides the electronic version of the results reported in both arXiv:2503.06849 and arXiv:2503.06843 regarding a cross-section measurement of single positive pion production in neutrino neutral current interactions using data from the ND280 detector of the T2K experiment. The release consists of the differential cross-section result in a csv file, as well as the postfit T2K flux in a ROOT file. For full details read the README.txt file that is part of this release.
