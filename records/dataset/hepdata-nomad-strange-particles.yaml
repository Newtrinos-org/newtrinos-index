id: hepdata-nomad-strange-particles
type: dataset
title: A study of strange particle production in nu/mu charged current interactions in the NOMAD experiment.
short: 'HEPData: NOMAD strange-particle production in νμ CC interactions'
description: CERN-SPS. Measurement of the yields and ratios of the production of the strange particles K0S, LAMBDA and LAMBDABAR in charged current (CC) neutrino interactions with a broad band neutrino beam (0-200 GeV) of mean energy of 45.3 GeV. The data come from the analysis of 1.3 million muon-neutrino CC interactions collected from 1995-1998.. Numerical values supplied by D Naumov. Note that several of the distributions presented here were not in the paper, but in the supplied data. These are flagged as such.
