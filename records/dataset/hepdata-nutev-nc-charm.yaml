id: hepdata-nutev-nc-charm
type: dataset
title: 'HEPData: Observation of neutral current charm production in nu/mu Fe scattering at the Tevatron.'
short: 'HEPData: NuTeV neutral-current charm production in νμ Fe'
description: We report on the first observation of open charm production in neutral current deep inelastic neutrino scattering as seen in the NuTeV detector at Fermilab. The production rate is shown to be consistent with a pure gluon-$% Z^{0}$ boson production model, and the observed level of charm production is used to determine the effective charm mass. As part of our analysis, we also obtain a new measurement for the proton-nucleon charm production cross section at $\sqrt{s}=38.8$ GeV.
