id: hepdata-microboone-inclusive-nue-wirecell
type: dataset
title: Search for an anomalous excess of inclusive charged-current $\nu_e$ interactions in the MicroBooNE experiment using Wire-Cell reconstruction
short: 'HEPData: MicroBooNE inclusive CC νe excess search (Wire-Cell)'
description: Data release for the first results from MicroBooNE's inclusive $\nu_e$CC search using Wire-Cell reconstruction, corresponding to information from arXiv:2110.13978. Attached is a python script which shows an example of how to use this data release to plot the unconstrained and constrained $\nu_e$CC FC data and predictions. Version 2 adds $\nu_\mu$CC energy resolution matrices, and fixes a small issue in the previous version in which the bins in the $\nu_e$CC energy resolution matrices were shifted by 50 MeV.
