title: MiniBooNE antineutrino neutral-current elastic differential cross section data release
short: 'MiniBooNE ν̄ NC elastic differential cross section: data release (PRD 91, 012004)'
description: One text file (nubarNCE_tables.txt) with the reconstructed nucleon-energy spectrum, migration matrices to true energy (bound nucleons in carbon, free nucleons in hydrogen, NCE-like background), detector efficiency and total error matrix for 'Measurement of the Antineutrino Neutral-Current Elastic Differential Cross Section'; antineutrino-mode flux from the flux release.
