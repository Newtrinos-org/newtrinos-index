id: hepdata-argoneut-cc-inclusive
type: dataset
title: Measurements of Inclusive Muon Neutrino and Antineutrino Charged Current Differential Cross Sections on Argon in the NuMI Antineutrino Beam
short: 'HEPData: ArgoNeuT inclusive νμ and ν̄μ CC differential cross sections on argon'
description: FNAL-T. The ArgoNeuT collaboration presents measurements of inclusive muon neutrino and antineutrino charged current differential cross sections on argon in the Fermilab NuMI beam operating in the low energy antineutrino mode. The data used in this analysis were collected between September 2009 and February 2010 and correspond to 1.20*10**20 protons on target. The results are reported in terms of outgoing muon angle and momentum at a mean neutrino energy of 9.6 GeV (neutrinos) and 3.6 GeV (antineutrinos), in the range 0 < THETA(MU) < 36 degrees and 0 < P(MU) < 25 GeV, for both neutrinos and antineutrinos.
