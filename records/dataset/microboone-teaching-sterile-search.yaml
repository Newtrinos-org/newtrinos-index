title: 'Teaching sterile neutrinos in an undergrad laboratory: a sterile-neutrino search using data from the MicroBooNE liquid-argon time projection chamber performed in an undergraduate teaching laboratory'
short: MicroBooNE open data for an undergraduate sterile-neutrino teaching lab
description: 'Dataset associated with "A sterile-neutrino search using data from the MicroBooNE liquid-argon time projection chamber performed in an undergraduate teaching laboratory" an educational paper to teach data analisys within particle physics for 3-4 yr physics major undergrads. Data format are csv, h5 and pkl 


  FERMILAB-DATA-2025-01https://inspirehep.net/literature/2971920


  Suggested text for acknowledgment is the following:We acknowledge the MicroBooNE Collaboration for making their data available for this project. The samples used in this study are simplified datasets derived from MicroBooNE, intended solely for teaching and pedagogical purposes. They are not representative of full detector performance and are not intended to support physics conclusions. We thank the MicroBooNE Collaboration for providing this resource.'
