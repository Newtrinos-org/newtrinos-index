id: super-k-atm-neutron-production-2025
type: dataset
title: 'Data Release: Measurement of neutron production in atmospheric neutrino interactions at Super-Kamiokande'
short: 'Super-K neutron production in atmospheric-ν interactions: data release'
description: 'This data release accompanies the article ["Measurement of neutron production in atmospheric neutrino interactions at Super-Kamiokande"](https://arxiv.org/abs/2505.04409). The data provided here includes observed average neutron multiplicity in atmospheric neutrino interactions at Super-Kamiokande (SK) as a function of the event''s visible energy, along with model predictions using various combinations of final-state interaction (FSI) models and secondary hadron interaction models.

  For details on the data selection and compared models, please refer to the associated article on [arXiv](https://arxiv.org/abs/2505.04409).

  Files Included:

  1. `x_bin_edges.txt`:Contains the x bin edges for all data, formatted as a list, which is equivalent to `np.logspace(np.log10(30), 4, 51)` in `numpy`. The bin edges are common for all event types included in the two comma-delimited csv files below.

  2. `data_observations.csv`:Contains the observed SK data.  - `event_type`: (`all`, `sr`, `mr`)    - `all`: All events that pass the selection criteria.    - `sr`: Single-ring events only.    - `mr`: Multi-ring events only.  - `x_bin_id`: Bin ID to match between data observations and model predictions.  - `x_bin_center`: Mean value of visible energy for events in the x bin.  - `y_nmult_est`: Average estimated neutron multiplicity for events in the x bin.

