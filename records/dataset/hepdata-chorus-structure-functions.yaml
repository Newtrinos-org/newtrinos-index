id: hepdata-chorus-structure-functions
type: dataset
title: 'HEPData: Measurement of nucleon structure functions in neutrino scattering.'
short: 'HEPData: CHORUS nucleon structure functions (lead target)'
description: After completion of the data taking for the νμ→ντ oscillation search, the CHORUS lead–scintillator calorimeter was used in the 1998 run as an active target. High-statistics samples of charged-current interactions were collected in the CERN SPS west area neutrino beam. This beam contained predominantly muon (anti-)neutrinos from sign-selected pions and kaons. We measure the flux and energy spectrum of the incident neutrinos and compare them with beam simulations. The neutrino–nucleon and anti-neutrino–nucleon differential cross-sections are measured in the range 0.01<x<0.7 , 0.05<y<0.95 , 10<Eν<200 GeV . We extract the neutrino–nucleon structure functions F2(x,Q2) , xF3(x,Q2) , and R(x,Q2) and compare these with results from other experiments.
