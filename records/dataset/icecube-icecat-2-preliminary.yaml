title: 'IceCat-2 Preliminary Data Release: Seven Selected Events'
short: 'IceCat-2 preliminary data release: seven selected alert events'
description: 'This preliminary data release contains alerts previously presented at the 39th International Cosmic Ray Conference (ICRC 2025), see PoS(ICRC2025)1224.

  IC-170922A — in spatial coincidence with the blazar TXS 0506+056, representing the first association between a neutrino alert and an astrophysical source. IC-220424A and IC-230416A — in spatial coincidence with NGC 7469. IC-200530A, IC-191119A, and IC-191001A — previously identified in spatial coincidence with several Tidal Disruption Events.

  In addition to these events, we also include IC-230724A in this preliminary release. Its inclusion is motivated by the fact that it was a promising Gold alert, with an average probability of astrophysical origin of 53%. An issue in the automatic processing pipeline responsible for the offline reconstruction delayed the distribution of its updated position (https://gcn.nasa.gov/circulars/34265). To ensure timely availability at the time, an alternative reconstruction algorithm was applied. Following the update of the reconstruction algorithms for high-energy track alerts in September 2024 (https://roc.icecube.wisc.edu/public/docs/IceCube_Update_Muon_Alert_Reco.pdf), the new position and the alert-related parameters have now been recalculated.'
