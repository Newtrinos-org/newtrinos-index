id: hepdata-ccfr-low-x-structure-functions
type: dataset
title: 'HEPData: A first measurement of low x low Q**2 structure functions in neutrino scattering.'
short: 'HEPData: CCFR low-x, low-Q² structure functions in neutrino scattering'
description: A new structure function analysis of CCFR deep inelastic nu-N and nubar-N scattering data is presented for previously unexplored kinematic regions down to Bjorken x=0.0045 and Q^2=0.3 GeV^2. Comparisons to charged lepton scattering data from NMC and E665 experiments are made and the behavior of the structure function F2_nu is studied in the limit Q^2 -> 0.
