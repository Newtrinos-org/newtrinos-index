id: t2k-nd-scintillator-ageing
type: dataset
title: Data release for "Scintillator ageing of the T2K near detectors from 2010 to 2021"
short: 'T2K near-detector scintillator ageing 2010–2021: data release'
description: 'The data release is associated with the paper "Scintillator ageing of the T2K near detectors from 2010 to 2021”, published in the Journal of Instrumentation and arXiv:2207.12982 [physics].


  The data release contains the data points and associated fits from the paper within two root files:


  The file T2KNearDetector_ScintAgeing_Standard_DataRelease.root contains the data points and fits shown in the standard ageing results described in Sections 4 and 5 of the paper.


  The file T2KNearDetector_ScintAgeing_ECalSupplemental_DataRelease.root contains the data points and fits shown in the supplemental ageing results described in Section 6 of the paper.


  All data points are provided as ROOT TGraphError objects and fit as ROOT TF1 objects. A full description of the contents of each root file is provided in the README.txt.'
