id: t2k-2025-mcmc-chains
type: result
title: Markov Chain Monte Carlo chain release for "Results from the T2K experiment on neutrino mixing including a new far detector muon-like sample"
short: 'T2K 2025 oscillation analysis: MCMC posterior chains'
description: 'Markov Chain Monte Carlo chain release for the Neutrino Oscillation Analysis of the T2K experiment reported in arXiv:2506.05889v2

  The format is consistent with the NuMCMCTools, and is produced without a prior reactor constraint on theta_13. Examples of how to make plots, change priors etc. can be found on the NuMCMCTools github repository (https://github.com/NuMCMCTools/NuMCMCTools).

  The chains released here are from a simultaneous fit between ND280 and SK data and include a smearing on delta m^2_32 due to out-of-model biases that were checked during the analysis.'
