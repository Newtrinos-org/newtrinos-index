id: jwst-desi-neutrino-mass-chains
type: result
title: Measuring neutrino masses with joint JWST and DESI DR2 data
short: 'Neutrino-mass constraints from JWST + DESI DR2: Cobaya MCMC chains'
description: 'This dataset contains posterior chains from MCMC sampling performed with Cobaya, together with summary results, covering three cosmological models: ΛCDM (LCDM), wCDM, and w0waCDM. For each model, we consider three neutrino mass hierarchies—NH (Normal Hierarchy), IH (Inverted Hierarchy), and DH (Degenerate Hierarchy); within each hierarchy we provide four observational data combinations: CMB, CMB+JWST, CMB+DESI, and CMB+DESI+JWST. These chains constitute the numerical sources for all figures in the paper’s main text and supplementary materials.'
