id: microboone-3plus1-numi-chi2-map
type: result
title: MicroBooNE 3+1 sterile neutrino search $\Delta \chi^2$ map for NuMI-only
short: 'MicroBooNE 3+1 sterile search: observed Δχ² map on a 3D grid (NuMI only)'
description: 'This text file contains the observed values of $\Delta \chi^2$ for each 4$\nu$ hypothesis, evaluated on a three-dimensional grid of oscillation parameters with dimensions $(\Delta m^2_{41}, \sin^2\theta_{14}, \sin^2\theta_{24}) = (100 \times 4000 \times 100)$. The fine binning in $\sin^2\theta_{14}$ (4000 points) was required to reproduce features observed in the NuMI-only analysis, which resulted in a file size too large for hosting on HEPData.


  This dataset corresponds to the $\chi^2$ map obtained using NuMI-only data. It is provided as a supplementary release in support of the MicroBooNE 3+1 sterile neutrino oscillation search using both the BNB and NuMI beams. All other associated data products are available on [HEPData (link)].


  Note that this NuMI-only result is not the final outcome of the MicroBooNE sterile neutrino analysis, which combines BNB and NuMI datasets. It is released here solely as an auxiliary result for completeness and reproducibility.'
doi: 10.5281/zenodo.17161262
