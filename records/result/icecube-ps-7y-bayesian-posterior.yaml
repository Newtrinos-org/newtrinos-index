id: icecube-ps-7y-bayesian-posterior
type: result
title: Bayesian posterior for IceCube 7 year point-source search with neutrino-count statistics
short: Bayesian posterior of the IceCube 7-year point-source search (neutrino counts)
description: The IceCube 7 year point-source search with neutrino-count statistics applies the non-Poissonian template fitting technique to IceCube high-energy neutrino data for the purpose of characterizing populations of point-sources. This analysis produces point-source population model posterior distributions for spatial templates that are correlated with the Milky Way, the Fermi bubbles, the Schlegel, Finkbeiner, and Davis dust map, the isotropic extragalactic sky, and the northern-sky. This data release includes the posterior samples produced by the analysis for these five templates, as well as an example Python program for making use of the samples, which can be used to establish limits on specific population models that would contribute to the observed IceCube neutrino flux.
