  provenance: "Computed by the NuFIT group from published experimental data and collaboration-provided χ² maps (e.g. Super-K atmospheric)."
  validation: "Newtrinos global fit compared in verification entry 10.1007_JHEP12(2024)216 (ordering preference, s23, Δm²31, solar Δm²21 tension)."
