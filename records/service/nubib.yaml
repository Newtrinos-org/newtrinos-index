id: nubib
type: service
title: NuBib — neutrino measurements, in one place
short: "NuBib: continuously updated index of published neutrino interaction and oscillation measurements (≈500 papers, 61 experiments)"
description: |-
  Curated, searchable bibliography of published neutrino measurements, covering interaction (cross-section) and
  oscillation results from 1972 to today. Papers can be filtered by experiment, channel and more, with links to
  arXiv, the journal, INSPIRE and BibTeX, a table builder and statistics. Complementary to this index: NuBib lists
  the measurements (papers), the Newtrinos Index the data, codes and inputs behind them.
url_landing: "https://nubib.org"
creators: [{name: César Jesús Valls}]
maintainers: [{name: César Jesús Valls}]
license: none-stated
access: open
distributions:
  - {url: "https://nubib.org", host: institutional, role: primary, label: NuBib web site, formats: [html]}
  - {url: "https://github.com/cesarjesusvalls/NuIntBib", host: github, role: mirror, label: "source bibliography (NuIntBib, TeX)", formats: [source-code]}
relations:
  - {rel: uses, target: inspire-hep}
sources: [accelerator, atmospheric, reactor, solar, astrophysical]
topics: [cross-section, oscillation]
service:
  operator: {name: César Jesús Valls}
  query_interface: "https://nubib.org"
  api_kind: none
curation:
  status: curated
  added: 2026-10-23
  source: manual (user suggestion)
  quality_notes: ["counts (492 papers, 61 experiments) from the landing page on 2026-10-23"]
