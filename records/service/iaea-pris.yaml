id: iaea-pris
type: service
title: IAEA Power Reactor Information System (PRIS)
short: "IAEA PRIS: every power reactor's location, thermal power, history and load factors — the input for reactor-ν fluxes"
description: Database of all nuclear power reactors worldwide (status, design, thermal/electric power, operating history, annual load factors), used to compute reactor antineutrino fluxes at detectors such as KamLAND, JUNO or SNO+.
url_landing: "https://pris.iaea.org"
owner: {name: International Atomic Energy Agency, kind: organization}
license: proprietary
license_notes: "IAEA terms of use; data free to view"
access: open
