  - {url: "https://pris.iaea.org", host: institutional, role: primary, formats: [html, xlsx]}
  - {url: "https://pris-stats.iaea.org", host: institutional, role: mirror, label: "PRIS statistics portal / API (current landing target)"}
sources: [reactor]
topics: [flux]
service:
  operator: {name: International Atomic Energy Agency, kind: organization}
  api: "https://pris-stats.iaea.org"
  api_kind: rest
newtrinos:
  modules: [reactor_flux, kamland]
  notes: "unit data from the PRIS API (retrieved 2026-10-09); operating history from archived PRIS reactor pages (web.archive.org)"
curation:
