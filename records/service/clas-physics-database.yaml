id: clas-physics-database
type: service
title: CLAS Physics Database (Jefferson Lab Hall B / MSU SINP)
short: 'CLAS physics database: JLab Hall B electro-/photoproduction observables (inputs to ν-interaction models)'
description: Searchable database of CLAS measured observables since 1998 (integrated and multi-differential cross sections, asymmetries, structure functions) for exclusive photo- and electroproduction off proton, neutron and nuclei, W<4 GeV, Q2<5 GeV2; mirrored at MSU. Pion electroproduction in the resonance region is a key input to neutrino resonance models.
