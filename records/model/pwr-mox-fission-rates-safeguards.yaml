id: pwr-mox-fission-rates-safeguards
type: model
title: Isotope-Specific Fission Rates for Neutrino Source Calculation in PWR Fuel Diversion Safeguarding
short: Isotope-specific fission rates for reactor-neutrino safeguards studies (MOX PWR diversion scenarios)
description: 'This dataset uses industry-standard simulation tools (CASMO-4/SIMULATE-3) to provide isotope-specific fission rates for a set of 15 plutonium diversion scenarios for a mixed-oxide loaded pressure water reactor. These diversion scenarios span a wide range of diverted fuel amounts, from 655.19 kg of fissile plutonium to 2.17 kg. Additionally, these isotope-specific fission rates are provided over three cycles with realistic fuel loading and shuffling patterns. The isotope-specific fission rates reported in this dataset can be combined with a neutrino emission model for the direct calculation of the reactor neutrino source. 

   

  This dataset is not intended to be used without a publication which is currently under development.'
