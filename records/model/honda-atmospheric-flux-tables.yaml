id: honda-atmospheric-flux-tables
type: model
title: HKKM atmospheric neutrino flux tables (Honda et al.)
short: "Honda (HKKM2014) atmospheric ν fluxes per site, energy, zenith and azimuth, with solar-min/max variants"
description: |-
  Tabulated atmospheric neutrino and antineutrino fluxes (νe, νμ) from the HKKM 3D calculation for many detector
  sites (Kamioka, Sudbury, Gran Sasso, South Pole, Frejus, INO, ...), binned in energy, cos(zenith) and azimuth,
  for solar minimum and maximum. The 2014 version is described in Phys. Rev. D 92, 023004 (2015).
url_landing: "https://www.icrr.u-tokyo.ac.jp/~mhonda/"
creators: [{name: M. Honda}, {name: M. Sajjad Athar}, {name: T. Kajita}, {name: K. Kasahara}, {name: S. Midorikawa}]
maintainers: [{name: M. Honda}]
version: HKKM2014
date_published: 2015
license: none-stated
