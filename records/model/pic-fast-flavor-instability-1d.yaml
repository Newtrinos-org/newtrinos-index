id: pic-fast-flavor-instability-1d
type: model
title: Particle-in-cell Simulation of the Neutrino Fast Flavor Instability
short: 'Particle-in-cell simulation of the neutrino fast flavour instability: data and scripts'
description: 1D_fiducial.tgz contains the input parameters and simulation output data from the fiducial simulation. Each timestamp with output data is stored in a plt* directory. scripts.tgz contains the data reduction and plotting scripts used in the paper. We require yt to read the data with our scripts. inputs.tgz contains input files for each of the simulations in the paper. The test problem inputs (MSW, bipolar, homogeneous FFI, inhomogeneous FFI) are part of the test suite in Emu. Simulations are run using the version of Emu (v1.1) at http://doi.org/10.5281/zenodo.4423166 or https://github.com/AMReX-Astro/Emu.
