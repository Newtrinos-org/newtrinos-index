id: lepton-interactions-gev-eev
type: model
title: Dataset for the analysis of medium to high energies lepton interactions including distinct channels
short: 'Neutrino interactions from GeV to EeV incl. trident channels: thesis data and code'
description: 'Esse arquivo contém os dados gerados na pesquisa de doutorado que tem como trabalho final a tese "Interações de neutrinos de GeV à EeV".

  O arquivo "Muon-Trident-main.zip" contém os códigos necessários para obter os resultados do processo de tridente de múon.

  O arquivo "DIS_NNPDF40_cuts_3tr.zip" contém os códigos necessários para reproduzir os resultados de espalhamentos de múons no LHC com o gerador de monte carlo POWHEG-BOX-RES.

  O arquivo "Events-HESE-IceCube-main.zip" contém os códigos necessários para simular eventos de neutrinos astrofísicos no IceCube.

  O arquivo "Neutrino-Transmission-main.zip" contém os códigos necessários para simular a propagação de neutrinos através de meios materiais com e sem física além do modelo padrão da física de partículas.

  O arquivo "images.zip" contém as imagens geradas para a tese, que foram obtidas usando os códigos supracitados.'
