id: dsnb-lunardini-2025
type: model
title: 'The diffuse supernova neutrino background: an update with modern population synthesis and core collapse simulations'
short: Diffuse supernova neutrino background with modern population synthesis and CCSN simulations
description: 'We provide the integrated diffuse supernova neutrino background, see arXiv:2506.22699 for the detail. The files correspond to the solid lines in fig. 6 of arXiv:2506.22699 , which is the case including binary effects and black hole forming collapses. Results are for un-oscillated neutrino fluxes (no flavor mixing) and are given for the BPASS case (file ..._BPASS.txt ) and the KIHNN case (file ..._KIHNN.txt). 


  Data Format:


  The data are in ASCII format and the meaning of the columns are as follows. 


  1: neutrino energy [MeV]


  2: electron-type neutrino flux [cm^-2 MeV^-1 s^-1]


  3: anti-electron-type neutrino flux [cm^-2 MeV^-1 s^-1]


  4: x-type neutrino flux [cm^-2 MeV^-1 s^-1]'
