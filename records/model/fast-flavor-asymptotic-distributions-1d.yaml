id: fast-flavor-asymptotic-distributions-1d
type: model
title: 'Dataset: Evaluating approximate asymptotic distributions for fast neutrino flavor conversions in a periodic 1D box'
short: 'Approximate asymptotic distributions for fast flavour conversion in a periodic 1D box: data'
description: In this data package we include two txt files and two zip files. The file Gaussian.txt contains 4 columns. The first column shows the indices of the file numbers contained in the file Gaussian_100.zip. The second, third, and fourth columns list the corresponding \(I_{\bar\nu}\), \(F_\nu\), and \(F_{\bar\nu}\), respectively. The file Maxent.txt contains 5 columns. The first column shows the indices of the file numbers contained in the file Maxent_100.zip while the second column lists the corresponding indices in the file Gaussian.txt. The third, fourth, and fifth columns list the corresponding \(I_{\bar\nu}\), \(F_\nu\), and \(F_{\bar\nu}\), respectively. Files Gaussian_100 and Maxent_100 give the asymptotic simulated outcomes of fast neutrino flavor conversions with the initial Gaussian and maximum-entropy distributions, respectively. Each data file xxxx.dat lists four columns for \(v_z\), \(P_{ee}(v_z)\), \(g_\nu(v_z)\), and \(g_{\bar\nu}(v_z)\), respectively. We take 100 \(v_z\) grids for all data.
