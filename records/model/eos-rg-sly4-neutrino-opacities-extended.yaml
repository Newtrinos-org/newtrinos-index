id: eos-rg-sly4-neutrino-opacities-extended
type: model
title: Data table for EoS RG(SLY4) with neutrino opacities, extended version nparam=3
short: EoS RG(SLy4) with neutrino opacities, extended version (CompOSE)
description: "The data table for the EoS RG(SLY4) with neutrino opacities, extended version of the family General Purpose EoS with 3 parameters \n                can be found via this link  compose.obspm.fr/eos/148 together with additional information on the EoS.\n                 \n                Please be aware that in particular the authors of the equation of state can be found in the references below and on the \n                Compose data base ( compose.obspm.fr/eos/148).\n                Thus if you use this entry, please cite the original references together with the link to the table. We are working currently on rectifying the automatic citation from zenodo with author information on the equation of state.\n                \n                \n                \n                The online service CompOSE provides data tables for different state of the art equations of state (EoS) \n                ready for further usage in astrophysical applications, nuclear physics and beyond.\n                \n                \n                CompOSE would not be possible without the financial and organizational support from a large number of institutions and individual\n                contributors. In particular, we gratefully acknowledge support by :\n                \n\n                \nCompStar, Research Networking Programs of the European Science Foundation (ESF)\n                \nNewCompStar, \"Exploring fundamental physics with compact stars\" (MPNS COST action MP1304). \n                \nPHAROS, \"The multi-messenger physics and astrophysics of neutron stars\" within the EU framework programme (COST action CA16214)."
