id: bosted-christy-fits
type: model
title: Bosted–Christy fits to inclusive electron scattering (F1F207 / F1F209 FORTRAN codes)
short: Bosted–Christy fits (F1F207/F1F209) to inclusive electron scattering on nucleons and nuclei
description: FORTRAN parametrisations of F1/F2 for proton, deuteron, neutron and nuclei (QE + resonance + inelastic, 2009 A>2 fit with JLab data) with C++ wrapper and deuteron error matrix; widely used for e/nu resonance-region and QE-tail modelling.
