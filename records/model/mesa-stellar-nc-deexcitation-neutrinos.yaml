id: mesa-stellar-nc-deexcitation-neutrinos
type: model
title: 'MESA files, scripts, and data for: On Stellar Neutrino Emission From Neutral-Current De-Excitation Of Nuclei'
short: 'MESA files: stellar neutrino emission from neutral-current de-excitation of nuclei'
description: 'MESA model files and plotting scripts for plots seen in ''On Stellar Neutrino Emission From Neutral-Current De-Excitation Of Nuclei''. Models were run using MESA version r24.08.1 and mesasdk-x86_64-linux-23.7.3,  sdk available at http://user.astro.wisc.edu/~townsend/resource/download/mesasdk


  Profiles of the stellar models at CC (800km/s infall) are contained within this zenodo and were used to calculate the ram pressure condition for explodability. We include history and final profile files for all three networks (161, 206, 330) with and without ncd. See inside /fig_6_8.'
