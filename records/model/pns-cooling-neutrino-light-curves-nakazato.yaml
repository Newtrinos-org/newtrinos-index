id: pns-cooling-neutrino-light-curves-nakazato
type: model
title: Supernova Neutrino Light Curves from Proto-Neutron Star Cooling with Various Nuclear Equation of State
short: Supernova neutrino light curves from proto-neutron-star cooling for many EoS (Nakazato et al. 2022)
description: We present the model spectra of neutrinos emitted from proto-neutron star (PNS) cooling used in Nakazato et al., Astrophys. J. 925 (2022) 98, arXiv:2108.03009 [astro-ph.HE]. So as to obtain the time evolution of neutrino spectra, PNS cooling simulations are performed with use of four nuclear equation of state (EOS) models and eight PNS cooling models with different initial conditions are involved for each EOS. The format of the spectral data is the same with that of Supernova Neutrino Database. For the details, see readme.pdf
