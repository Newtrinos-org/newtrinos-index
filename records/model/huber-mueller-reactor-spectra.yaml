id: huber-mueller-reactor-spectra
type: model
title: Huber–Mueller reactor antineutrino spectra
short: "Reactor ν̄e spectra per fissioning isotope: Huber (235U, 239Pu, 241Pu conversion) + Mueller (238U ab initio)"
description: |-
  The standard reactor antineutrino flux model: converted ILL β spectra for ²³⁵U, ²³⁹Pu and ²⁴¹Pu (Huber 2011,
  with erratum) and the summation calculation for ²³⁸U (Mueller et al. 2011), with uncertainty breakdowns and
  correlation information. Tables are in the papers' supplements; Huber's page provides machine-readable files.
