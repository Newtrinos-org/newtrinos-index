id: fast-flavor-qcd-phase-transition-sn
type: model
title: 'Dataset: Occurrence of fast neutrino flavor conversions in QCD phase-transition supernovae'
short: 'Fast flavour conversions in QCD phase-transition supernovae: figure data'
description: 'This is the data provided in the article "Occurrence of fast neutrino flavor conversions in QCD phase-transition supernovae" to support Figures 7, 8, 9 and 11.


  The file data_fig7.txt contains 5 columns. The first and second columns shows the post-second-bounce time in millisecond and radius in kilometer of the fast-flavor-conersion (FFC) region, respectively. The other columns list the corresponding growth rate, $\bar\nu_e$ survival ratio and survival probability, respectively. 


  The file data_fig8and9.txt contains 33 columns. The first column shows the post-second-bounce time in millisecond. The other columns list the estimated event rate and the corresponding mean energy for four scenarios of no oscillations, inverted mass ordering (IO), normal ordering (NO), and flavor equipartition in four detection channels. 


  The file data_fig11.txt contains 7 columns for the abundance yields as a function of atomic number, Z.'
