id: fast-flavor-qke-time-dependent
type: model
title: 'Dataset: Neutrino quantum kinetics for fast flavor conversion in a time-dependent environment'
short: 'Neutrino quantum kinetics for fast flavour conversion in a time-dependent environment: data'
description: 'This dataset includes two types of visualization videos for models including QKE-L, QKE-M, QKE-H, ECT, ECT-a0.1,, ECT-box in the article "Neutrino quantum kinetics for fast flavor conversion in a time-dependent environment".


  The first type of videos starting with "profile" shows the time evolution of radial profiles of neutrino number densities for $\nu_e$, $\bar\nu_e$, $\nu_x$, and $\bar\nu_x$, together with three inset figures showing the angular distributions for each species and electron-minus-heavy-flavor lepton number (E-XLN) at three selected radii of 36, 42, and 50 km.


  The second type of videos starting with "contour" shows the time evolution of radial and velocity contour profiles for the off-diagonal density matrix element $\langle\varrho_{ex}\rangle_E$ (upper left), the phase angle of the off-diagonal component $\phi_{ex}$ (lower left), the $\nu_e$ number fraction (upper right), and the non-coarse-grained E-XLN angular distribution (lower right).'
