id: plasmon-decay-neutrino-emission-ns
type: model
title: 'Neutrino emission by plasmon decay in a strong magnetic field: Data material'
short: 'Neutrino emission by plasmon decay in strong magnetic fields (neutron-star crust): data'
description: 'This data reference paper summarizes the fundamental calculated results obtained analytically for the case of a neutron star (NS) crust: it’s cooling rate, time-scale evolution and neutrino luminosity, based on two different theories- Photo-Neutrino (PN) interaction and conventional weak interaction. Considering the NS environment as a degenerate plasmon composition the calculation tables are given.'
