id: presupernova-models-kato
type: model
title: 'Dataset for "Comprehensive neutrino light curves and spectra: from pre-supernova evolution to early supernova phase"'
short: MESA pre-supernova models for the comprehensive neutrino light-curve study (Kato et al.)
description: 'Stellar evolution models used in the publication "Comprehensive neutrino light curves and spectra: from pre-supernova evolution to early supernova phase" (arXiv: 2603.09810).


  All models were computed with MESA version r24.08.1, MESA SDK version x84_64-linux-24.7.1, OS AlmaLinux 9.8.


  Contains


  `pre_sn_neutrino.tar.gz`: Working directory for evolution calculations. Mostly adapted from the test suite "20M_pre_ms_to_core_collapse".


  `XXmsun.tar.gz`: Bundle of profile and history files of the evolution for a XX solar mass star with no mass loss.'
