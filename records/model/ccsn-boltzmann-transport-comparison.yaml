id: ccsn-boltzmann-transport-comparison
type: model
title: A Detailed Comparison Of Multi-Dimensional Boltzmann Neutrino Transport Methods In Core-Collapse Supernovae
short: Comparison of multi-dimensional Boltzmann neutrino transport in core-collapse supernovae (Richers et al. 2017)
description: 'This dataset contains results of 1D and 2D static neutrino transport calculations using discrete ordinates and Monte Carlo methods, as described in the 2017 paper by the same name. The results include the neutrino momentum space grids used for the simulations, the full spectral and angular distribution functions, energy-dependent angular moments of the distribution functions, and neutrino heating rates. The HDF5 dataset name corresponds to the simulation of the same name in the 2017 paper, Table 1. Also included are the fluid backgrounds and opacities. See the readme for a description of all quantities in the datasets.


  There are also two simulation setups including all initial conditions and parameters for 1D and 2D Monte Carlo calculations using the open-source code Sedonu. This accompanies Sedonu commit 8bd509b27aa0461df26b194df65b4526d6c153fe.'
