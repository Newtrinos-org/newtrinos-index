id: collapsar-neutrino-gw-signatures
type: model
title: Data for Collapsar Disk Outflows III. Detectable Neutrino and Gravitational Wave Signatures
short: 'Collapsar disk outflows III: neutrino and gravitational-wave signal time series'
description: 'Raw time series of neutrino, gravitational wave, and shock data as a function of post-bounce time, obtained by post-processing the simulations reported in arXiv:2507.17836.


  Zip file decompresses into two folders:


  1) dt_models/


  2) PaperI_models/


  Files:


  1) neutrino_lum_ener_[MODEL].dat: neutrino luminosities and mean energies


  2) gw_strain_[MODEL].dat: gravitational wave strain


  3) shock_coeff_[MODEL].dat: monopole, dipole, and quadrupole shock coefficients


  Where MODEL is the name of each model, following the same notation as in the paper (see Table I). Columns and units are indicated in the header of each file. For Paper I models, all data for 16TI-SFHo is provided (Figure 1), while for the other models only the GW strain is provided (Table III and Figure 4).


  Please cite the paper if you use this data in publications.'
