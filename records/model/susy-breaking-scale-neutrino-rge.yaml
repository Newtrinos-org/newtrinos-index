id: susy-breaking-scale-neutrino-rge
type: model
title: Effects of variations of SUSY breaking scale on neutrino parameters at low energy scale under radiative corrections
short: 'SUSY-breaking-scale effects on neutrino masses and mixing under RG running: data'
description: The paper addresses the effects of the variations of the SUSY breaking scale $m_s$ in the range (2-14) TeV on the three neutrino masses and mixings, in running the renormalization group equations (RGEs) for different input values of high energy seesaw scale $M_R$, in both normal and inverted hierarchical neutrino mass models. The present investigation is a continuation of the earlier works based on the variation of $m_s$ scale. Two approaches are adopted one after another - bottom-up approach for running gauge and Yukawa couplings from low to high energy scale, followed by the top-down approach from high to low energy scale for running neutrino parameters defined at high energy scale, along with gauge and Yukawa couplings. A self-complementarity relation among three mixing angles is also employed in the analysis. Significant effect due to radiative corrections on neutrino parameters with the variation of SUSY breaking scale $m_s$, is observed.
