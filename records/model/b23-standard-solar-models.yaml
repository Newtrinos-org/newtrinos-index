id: b23-standard-solar-models
type: model
title: Standard Solar Models B23 / SF-III
short: "B23 standard solar models (SF-III rates): fluxes, correlations, structure and production profiles, six compositions"
description: |-
  The B23 generation of standard solar models computed with the Solar Fusion III nuclear rates, for six solar
  surface compositions (GS98, AGSS09met, C11, AAG21, MB22-phot, MB22-met). Provides neutrino fluxes with
  uncertainties and correlation matrices, the solar structure (including electron density) and the radial
  production distributions of every flux component. MB22-met is the NuFIT 6.0 reference model.
