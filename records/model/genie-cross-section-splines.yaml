id: genie-cross-section-splines
type: model
title: GENIE cross-section spline files (genie_xsec)
short: Pre-computed GENIE cross-section splines per tune (gxspl-FNALsmall.xml), distributed via CVMFS / Fermilab
description: Pre-computed total cross sections of the GENIE event generator for each model configuration ("tune"), as distributed in the genie_xsec product on CVMFS. Newtrinos extracted ten tunes (GENIE 2.12 and 3.x, e.g. G18_10a_02_11a, AR23_20i_00_000) into an HDF5 file.
