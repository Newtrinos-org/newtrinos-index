  label: Fermilab SciSoft genie_xsec packages
  formats:
  - xml
- url: https://github.com/Newtrinos-org/Newtrinos.jl/tree/main/src/physics/xsec_data
  host: github
  role: mirror
  label: extracted splines (genie_splines.h5) + extract_genie_splines.py
  formats:
  - hdf5
