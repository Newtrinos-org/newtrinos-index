id: nlo-neutrino-rates-mev-temperatures
type: model
title: Tabulation and interpolation of NLO neutrino-antineutrino production and scattering rates at MeV temperatures
short: 'NLO neutrino–antineutrino production and scattering rates at MeV temperatures: tables'
description: 'This record contains data used in the paper "Neutrino-antineutrino production, annihilation, and scattering at MeV temperatures and NLO accuracy" 2412.03958. Please consult the main text for details on the tabulated coefficients and their proper implementations.


  We provide numerical data and an interpolation routine (c-code) for evaluating double-differential rates, intended to facilitate possible studies of the full kinetic equations for neutrino decoupling in the early universe. These data can also be used to obtain integrated quantities, such as the energy density transfer rates, or neutrino interaction rates (e.g. 2312.07015). The QED corrections to the spectral functions were computed using an adapted version of the public code: https://doi.org/10.5281/zenodo.3478143 .


  The archive file contains:


  grid_ABCD.dat : recorded coefficients A, B, C, D (on p+,p- grid in units of QED plasma temperature)


  interpolation.c : code to interpolate and calculate the (integrated) energy density transfer rates


  aux/... : additional files needed for multidimensional integration routine "cubature"'
