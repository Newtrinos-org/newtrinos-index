id: chaos-fast-flavor-instability
type: model
title: Chaos in Inhomogeneous Neutrino Fast Flavor Instability
short: 'Chaos in inhomogeneous neutrino fast-flavour instability: simulation data'
description: 'Data from paper "Chaos in inhomogeneos fast flavor instability".


  Dense neutrino gases exhibit complex flavor oscillations due to coherent forward scattering among neutrinos. The potentially chaotic nature of these oscillations challenges the prediction of neutrino flavor transformations in simulations. By studying small flavor perturbations in a small region within a NSM and a simplified neutrino distribution, we observe chaotic paths in the flavor state space, making micro-scale neutrino flavor changes unpredictable. However, this chaos has minimal impact on the stability of the domain-averaged neutrino density matrix, indicating that despite exponential errors, domain-averaged quantities remain reliable.


  For information regarding the data read the "information.txt" files in "nsm.tar.gz" and "fiducial.tar.gz".'
