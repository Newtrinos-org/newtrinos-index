id: seyfert-corona-nuclear-acceleration
type: model
title: Multimessenger Constraints on Nuclear Acceleration in Neutrino-Emitting Seyfert Coronae
short: 'Nuclear cascades in neutrino-emitting Seyfert coronae: model outputs and scripts'
description: 'Data and plotting scripts for nuclear cascades in Seyfert coronae


  This archive contains selected model outputs and standalone Python scripts for plotting cosmic-ray distributions, interaction rates, nuclear cascades, and radiation spectra for NGC 1068 and NGC 7469. It also includes the Fe momentum-diffusion sensitivity test and a nuclear Bethe–Heitler (BH) pair-radiation comparison.


  The scripts read saved data; they do not rerun acceleration, nuclear transport, or radiation calculations.'
