id: galprop-diffuse-neutrino-milky-way
type: model
title: Datasets for "Simulating the Diffuse Neutrino Emission from the Milky Way with GALPROP"
short: GALPROP skymaps of the diffuse Galactic neutrino emission
description: 'This repository includes six skymaps of the predicted neutrino emission and all configuration files required to reproduce them in GALPROP.


  There are six skymaps, with filenames `neutrino_healpix_57_*_SS_R12_PBSS_neutrino.gz`, where the first `*` denotes the source distribution model used and the second denotes any injected CR spectral index changes used (see section 2 of the paper). All six skymaps contain the per-flavour neutrino flux. The energy axis for the flux can be found in the header.


  The skymaps can be reproduced by downloading and installing GALPROP version 57 and using the `galdef_57_*_SS_R12_PBSS_neutrino*` and `sourceClass_*_0_AMS_it3*.pars`. All other required files are included in the installation of GALPROP version 57. Detailed instructions on configuring GALPROP can be found in the README file.'
