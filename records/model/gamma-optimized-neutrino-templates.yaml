id: gamma-optimized-neutrino-templates
type: model
title: gamma-optimized neutrino templates
short: Gamma-ray-optimised Galactic diffuse neutrino templates (HEALPix maps)
description: 'Neutrino flux map predicted in the Max and Min configurations and for three different resolutions (given by their NSIDE value in the name of the files) and adopting Kelner-Aharonian cross sections for neutrino production. Neutrino fluxes produced from the interaction of cosmic rays (protons and helium, in this case) with atomic and molecular gas are given in separated files.


  Please, when using these templates, cite the following references:https://iopscience.iop.org/article/10.1088/1475-7516/2025/12/041https://www.frontiersin.org/journals/astronomy-and-space-sciences/articles/10.3389/fspas.2022.1041838/fullhttps://www.aanda.org/articles/aa/full_html/2023/04/aa43714-22/aa43714-22.html'
