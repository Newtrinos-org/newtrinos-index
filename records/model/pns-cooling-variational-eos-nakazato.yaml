id: pns-cooling-variational-eos-nakazato
type: model
title: Supernova Neutrino Light Curves from Proto-Neutron Star Cooling with a Variational Nuclear Equation of State and Multi-Nucleus Composition
short: Supernova neutrino light curves with a variational EoS and multi-nucleon effects (Nakanishi et al. 2025)
description: We present the model spectra of neutrinos emitted from proto-neutron star (PNS) cooling used in Nakanishi et al., Astrophys. J. 992 (2025) 27, arXiv:2505.19721 [astro-ph.HE]. So as to obtain the time evolution of neutrino spectra, PNS cooling simulations are performed with use of a variational nuclear equation of state (EOS) including multi-nucleus composition (commonly known as Furusawa-Togashi EOS) and eight PNS cooling models with different initial conditions are involved. The format of the spectral data is the same with that of Supernova Neutrino Database. For the details, see readme.pdf
