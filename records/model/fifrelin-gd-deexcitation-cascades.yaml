id: fifrelin-gd-deexcitation-cascades
type: model
title: 'Data from: Improved FIFRELIN de-excitation model for neutrino applications'
short: FIFRELIN de-excitation cascades for ¹⁵⁶,¹⁵⁸Gd after neutron capture (neutrino-detector simulations)
description: 'New FIFRELIN cascades for the isotopes 156,158Gd are distributed to the community, to be used for various applications. The new cascades feature an improved modeling of de-excitation. The main improvements are: 1) Inclusion of primary transitions from EGAF database. 2) Treatment of gamma-directional correlations 3) Improved physics for the Internal Conversion process and X ray emission. With the use of the files provided, please cite the following publication: H. Almazán et al, The European Physical Journal A volume 59, Article number: 75 (2023) DOI: https://doi.org/10.1140/epja/s10050-023-00977-x'
