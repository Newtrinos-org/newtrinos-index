id: ccsn-neutrino-light-curves-kato
type: model
title: 'Data release v1.0: Neutrino luminosities and spectra for "Comprehensive Neutrino Light Curves and Spectra: From Pre-supernova Evolution to Early Supernova Phase"'
short: Neutrino luminosities and spectra from pre-supernova to early supernova phase (Kato, Nagakura et al.)
description: 'This dataset provides the neutrino emission properties (luminosities, mean energies, and spectra) calculated in our comprehensive 1D core-collapse supernova (CCSN) study, as presented in the paper "Comprehensive Neutrino Light Curves and Spectra: From Pre-supernova Evolution to Early Supernova Phase".


  update1: A new version, v1.1, was released on June 10, 2026. Please use this version if you would like to download the data for individual progenitor models.DOI: 10.5281/zenodo.20618971


  Project Overview & Dataset In this project, we performed continuous 1D simulations covering the evolution from the pre-supernova phase to the early post-bounce phase. From these simulations, this dataset exclusively releases the resulting neutrino light curves and spectral data.


  We provide the neutrino data for various progenitor models covering Zero-Age Main-Sequence (ZAMS) masses from 10 to 40 $M_\odot$, evaluated using two different stellar evolution codes:


  HOSHI models


  MESA models


  Data Contents The uploaded ZIP file contains the time evolution of:


  Neutrino luminosities


  Mean energies


  Spectra for all neutrino flavors


  Usage and Scripts For detailed data formats, variables, and sample Python scripts to read the data, please visit our GitHub repository: https://github.com/Chinami1229/massivestar-neutrino-data.git


  Future Updates Please note that this dataset may be updated in the future to reflect improvements in our simulation codes or physical models. We recommend checking for the latest version on Zenodo.


  Citation If you use this dataset in your research, please cite the following paper: "Comprehensive Neutrino Light Curves and Spectra: From Pre-supernova Evolution to Early Supernova Phase" (Link/DOI to the paper will be added here upon publication)'
