id: pns-cooling-high-low-mass-nakazato
type: model
title: Supernova Neutrino Light Curves from Cooling of High/Low-Mass Proto-Neutron Stars
short: Supernova neutrino light curves from cooling of high/low-mass proto-neutron stars (Suwa et al. 2019)
description: 'We present the model spectra of neutrinos emitted from proto-neutron star (PNS) cooling used in Suwa et al., Astrophys. J. 881 (2019) 139, arXiv:1904.09996 [astro-ph.HE]. So as to obtain the time evolution of neutrino spectra, PNS cooling simulations are performed from some initial conditions with different baryon masses and entropy profiles. The data names are as below: spectobHmaxS.data: \(M_b = 2.35M_\odot (M_{\rm NS, g}=2.05M_\odot)\), High initial entropy spectobHminS.data: \(M_b = 1.29M_\odot (M_{\rm NS, g}=1.20M_\odot)\), High initial entropy spectobLmaxS.data: \(M_b = 2.35M_\odot (M_{\rm NS, g}=2.05M_\odot)\), Low initial entropy spectobLminS.data: \(M_b = 1.29M_\odot (M_{\rm NS, g}=1.20M_\odot)\), Low initial entropy where \(M_b\) is the baryon mass of PNS and \(M_{\rm NS, g}\) is the gravitational mass of the remnant neutron star. The format of these data is the same with that of Supernova Neutrino Database. See also readme.pdf'
