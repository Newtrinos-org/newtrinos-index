id: fifradina-neutron-capture-cryogenic
type: model
title: Fifradina dataset for radiative thermal neutron-capture processes in cryogenic detectors (CRAB)
short: FIFRADINA γ-cascade data for thermal neutron capture in cryogenic CEvNS/DM detectors (CRAB calibration)
description: "The emission of \\(\\gamma\\)-rays after a neutron capture in a cryogenic detector can generate mono-energetic nuclear recoils in the sub-keV regime, of direct interest for the calibration of Dark Matter and Coherent Elastic Neutrino Nucleus Scattering experiments. Accurate predictions of the nuclear recoil spectra induced by neutron captures require taking into account the interplay between the development in time of the de-excitation γ-cascade of the target nucleus and that of the associated atomic collisions in matter. Detailed simulations coupling the FIFRELIN code for the description of the γ-cascades and the Iradina code for the modelling of the fast atomic movements in matter have been described in G. Soum-Sidikov and al. (CRAB collaboration), Study of collision and γ-cascade times following neutron-capture processes in cryogenic detectorset al. 2023. doi :10.48550/arXiv.2305.10139. URL https://doi.org/\n 10.48550/arXiv.2305.10139 This dataset acts as supplemental material to this article. It provides detailed nuclear de-excitation cascades with associated total recoil energies for: Al (n, \\(\\gamma\\)) in Al2O3 Si (n, \\(\\gamma\\)) in Si Ge (n, \\(\\gamma\\)) in Ge W (n, \\(\\gamma\\)) in CaWO4"
