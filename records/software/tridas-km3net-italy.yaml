id: tridas-km3net-italy
type: software
title: Trigger and Data Acquisition System (TriDAS) for KM3NeT-Italy
short: 'TriDAS: trigger and data acquisition system of KM3NeT-Italy'
description: TriDAS is a software which implements the Trigger and Data Acquisition system for the KM3NeT- Italy underwater neutrino telescope. The detector is based on ”all data to shore” approach in order to reduce the complexity of the submarine hardware. At the shore station the TriDAS collects, processes and filters all the data coming from the detector, storing triggered events to a permanent storage for subsequent analysis.
