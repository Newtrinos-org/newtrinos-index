id: coherent-sns-geant4-simulation
type: software
title: A Geant4 simulation of particle production at the Spallation Neutron Source
short: COHERENT Geant4 simulation of particle (and neutrino) production at the SNS
description: Release of COHERENT collaboration software associated with the neutrino production studies of the Spallation Neutron Source (SNS) at Oak Ridge National Laboratory described in arXiv:2109.11049. This simulation investigates the particle production at the SNS using Geant4, and we include both the base simulation and our analysis scripts in this package.
