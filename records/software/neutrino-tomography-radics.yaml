id: neutrino-tomography-radics
type: software
title: 'balintradics/NeutrinoTomography: First release of Neutrino Tomography project'
short: 'NeutrinoTomography: propagation through a 3D Earth model with radioactive-isotope distributions'
description: Set of codes to solve the complex diff. equation of neutrino propagation through vacuum/material combined with a customized discretized, full 3D Earth model with Radioactive Isotope (238U, 235U, 232Th, 40K) distribution and Density models. Geoneutrino flux on the Earth's surface can be obtained at any longitude/latitude and used with standard computer tomographic reconstruction libraries by way of a generated sinogram.
