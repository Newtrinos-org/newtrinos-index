id: magnus-oscillations
type: software
title: 'Magnus: neutrino oscillation probabilities for any Hermitian Hamiltonian, any number of flavors, and any matter profile'
short: 'Magnus: oscillation probabilities for any Hamiltonian, number of flavours and matter profile (Magnus expansion)'
description: Neutrino oscillation probabilities computed with the Magnus expansion, for an arbitrary number of flavors and any Hamiltonian, time-dependent or not. Every truncation of the series lives in the Lie algebra, so the evolution operator it exponentiates is unitary exactly rather than to the accuracy of the truncation.
