id: daemonflux
type: software
title: "daemonflux: data-driven muon-calibrated neutrino flux"
short: "daemonflux: atmospheric ν flux calibrated on muon data, with a full covariance of flux uncertainties (Python)"
description: |-
  Atmospheric neutrino flux model obtained by calibrating hadronic-interaction and cosmic-ray models (MCEq) on
  atmospheric muon data, providing fluxes together with a complete, data-driven covariance of their uncertainties; a
  modern alternative to Honda/Bartol-style uncertainty schemes.
