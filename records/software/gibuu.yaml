id: gibuu
type: software
title: GiBUU — Giessen Boltzmann-Uehling-Uhlenbeck transport model
short: 'GiBUU: transport-theoretical event generator for lepton- and hadron-nucleus reactions, incl. neutrino interactions'
description: Fortran transport model describing elementary reactions on nuclei (neutrino, electron, photon, hadron and heavy-ion induced) with consistent nuclear ground state and final-state interactions; widely used as a neutrino event generator.
