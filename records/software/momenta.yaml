id: momenta
type: software
title: MOMENTA v1.2 - Multi-Observations Multi-Energy Neutrino Transient Analysis
short: 'MOMENTA: constraints on neutrino emission from transient sources (multi-observation, multi-energy)'
description: 'This package aims to compute constraints on the neutrino emission from transient objects (either point sources or with some larger uncertainty on the localisation). The user should provide all the inputs in terms of neutrino observations and instrument response functions, as well as the flux spectrum and optionally the jet model to be considered. The code returns the posterior distribution from which upper limits, credible intervals and other information may be obtained.


  The main feature is that multiple samples from multiple detectors can be easily combined, allowing for constraints spanning large energy ranges and/or with complementary sky coverage.


  More information on the methods is provided in the PDF documentation in doc/ and these conference proceedings.


  This is the second release of the software, including the following updates:


  a speed-up of the computation with vectorized prior/posterior computations


  the possibility to perform stacking analyses


  the possibility to use tabulated flux as inputs instead of analytical ones


  Additional example notebooks have been added to introduce the new features.'
