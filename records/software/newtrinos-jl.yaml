id: newtrinos-jl
type: software
title: Newtrinos.jl
short: "Newtrinos.jl: Julia package for global analyses of neutrino data (physics modules, experiment likelihoods, inference)"
description: |-
  Modular physics (oscillations incl. BSM, fluxes, cross sections, Earth model) and likelihoods of many experiments
  built from public data releases, with fitting, profiling and scanning tools. Reproductions of published results
  are collected on the Newtrinos verifications site.
