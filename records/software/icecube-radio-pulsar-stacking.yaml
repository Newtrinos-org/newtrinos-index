title: IceCube-Package
short: Code for a stacked search for IceCube neutrinos from radio pulsars (arXiv:2306.03427)
description: 'This repository contains the code used to perform the analysis described in the paper "A stacked search for spatial coincidences between IceCube neutrinos and radio pulsars" (https://arxiv.org/abs/2306.03427). The code is written in Python 3.10 and uses the following packages: numpy, scipy, matplotlib, pandas, numba, multiprocessing.'
