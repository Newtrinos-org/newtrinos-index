id: presn-trigger
type: software
title: 'presn-trigger: Systematic Pre-Supernova Neutrino Trigger Pipeline'
short: 'presn-trigger: pre-supernova neutrino trigger pipeline across progenitor models'
description: Reproducible pipeline for evaluating pre-supernova neutrino trigger performance across published progenitor models. Implements the full chain from SNEWPY-based luminosity extraction through detector response, Poisson Monte Carlo injection, sliding-window cumulative significance, isotonic calibration, and tiered alert logic. Applied to nine models from four independent simulation groups (Yoshida 2016, Kato 2017, Patton 2017, Odrzywolek 2010) spanning 12–30 solar masses.
