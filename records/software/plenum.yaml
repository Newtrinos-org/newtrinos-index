title: PLEnuM software tools
short: "PLEnuM: tools to assess a PLanEtary NeUtrino Monitoring network of neutrino telescopes (diffuse and point sources)"
description: |-
  Code and notebooks quantifying the potential of a global network of neutrino telescopes (PLEnuM) for the diffuse
  astrophysical flux and point-like sources, with telescopes modelled on IceCube's public 10-year data release.
