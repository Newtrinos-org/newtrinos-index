id: graphnet
type: software
title: GraphNeT
short: "GraphNeT: deep-learning (graph neural network) library for event reconstruction in neutrino telescopes"
description: |-
  Python library for deep-learning-based reconstruction and classification of events in neutrino telescopes
  (IceCube, KM3NeT, P-ONE, …): data converters, graph representations of detector hits, GNN models and training
  pipelines, with pretrained models.
