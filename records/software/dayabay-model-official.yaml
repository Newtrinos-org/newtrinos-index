id: dayabay-model-official
type: software
title: dayabay-model-official
short: Official Python model of the Daya Bay nGd oscillation analysis (predictions, χ², fits) for the full data release
description: |-
  The Daya Bay collaboration's analysis model for the open nGd data: reads the analysis dataset in any of its
  formats and provides the predicted IBD spectra per AD, the χ² functions and every intermediate quantity.
  Built on the dagflow framework; worked examples and fit commands are in the companion repository dayabay-analysis.
