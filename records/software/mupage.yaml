id: mupage
type: software
title: 'MUPAGE : a MUon GEnerator from PArametric formulas'
short: 'MUPAGE: parametric atmospheric-muon bundle generator for underwater/ice neutrino telescopes'
description: 'The MUPAGE code was developed for the production of atmospheric muon bundles on the underwater detector CAN surface, without a full Monte Carlo simulation but using parametric formulas described in [1].

  The first release was written by G. Carminati, M. Bazzotti, A. Margiotta, M. Spurio in 2007 within the ANTARES Collaboration and described in [2].

  The code is maintained by the KM3NeT collaboration since v3r5.

  [1] A parameterisation of single and multiple muons in the deep water or ice doi:10.1016/j.astropartphys.2005.10.005

  [2] Atmospheric MUons from PArametric formulas: a fast GEnerator for neutrino telescopes (MUPAGE) doi:10.1016/j.cpc.2008.07.014'
