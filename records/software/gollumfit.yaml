id: gollumfit
type: software
title: 'GollumFit: An icecube open-source framework for binned-likelihood neutrino telescope analyses'
short: 'GollumFit: IceCube open-source framework for binned-likelihood neutrino-telescope analyses'
description: We present GollumFit, a framework designed for performing binned-likelihood analyses on neutrino telescope data. GollumFit incorporates model parameters common to any neutrino telescope and also model parameters specific to the IceCube Neutrino Observatory. We provide a high-level overview of its key features and how the code is organized. We then discuss the performance of the fitting in a typical analysis scenario, highlighting the ability to fit over tens of nuisance parameters. We present some examples showing how to use the package for likelihood minimization tasks. This framework uniquely incorporates the particular model parameters necessary for neutrino telescopes, and solves an associated likelihood problem in a time-efficient manner.
