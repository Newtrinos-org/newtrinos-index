id: achilles
type: software
title: "ACHILLES: A CHIcagoLand Lepton Event Simulator"
short: "ACHILLES: event generator for electron– and neutrino–nucleus scattering with spectral functions and cascade"
description: |-
  Event generator for lepton–nucleus scattering that combines ab-initio-inspired nuclear models (spectral functions)
  with a factorised treatment of the hard interaction and a semi-classical intranuclear cascade, validated on
  electron scattering and applied to neutrino interactions.
