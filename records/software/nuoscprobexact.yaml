title: NuOscProbExact
short: 'NuOscProbExact: exact two- and three-flavour oscillation probabilities via SU(2)/SU(3) expansions'
description: Python code computing exact oscillation probabilities for arbitrary time-independent Hamiltonians (vacuum, matter, NSI, Lorentz violation) using expansions of the evolution operator in SU(2) and SU(3) generators.
