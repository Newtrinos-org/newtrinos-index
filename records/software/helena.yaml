id: helena
type: software
title: 'HELENA: High-Energy Lepto-hadronic Emission and Neutrino Analysis'
short: 'HELENA: lepto-hadronic jet emission model with photon and neutrino spectra'
description: HELENA calculates coupled particle transport and photon and neutrino emission in a one-zone steady-state jet model. Its maintained inference and differentiation path is photon-only; neutrino spectra are post-fit predictions. BSD-3-Clause applies to HELENA software, not additional rights in third-party example data or reference products; source-specific notices and attribution are documented in examples/README.md.
