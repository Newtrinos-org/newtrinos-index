title: 'kmaltsev/explodability: Explodability criteria for the neutrino-driven supernova mechanism'
short: Explodability and fallback criteria for the neutrino-driven supernova mechanism (population synthesis)
description: 'First release of


  the explodability and fallback criteria and of


  the core collapse supernova recipe for binary population synthesis


  for predicting the final fates of massive stars undergoing iron-core collapse at the end of their evolution.

  These are introduced in Maltsev et al. (to-be-submitted).'
