id: sksnsim
type: software
title: 'SKSNSim/SKSNSim: SKSNSim: Supernova burst and Diffuse Supernova Neutrino Background simulator for Water Cherenkov Detectors'
short: 'SKSNSim: supernova burst and DSNB event generator for water Cherenkov detectors'
description: 'SKSNSim (Super-Kamiokande Supernova Simulator) is an event generator for supernova bursts and diffuse supernova neutrino background (DSNB).

  This repository contains code and example configurations for:


  Calculating the neutrino interaction in water for the two purposes, individual core-collapse supernova bursts and DSNB


  Generating neutrino events in large water Cherenkov detectors


  The tool is intended for use in studies of supernova neutrino detection sensitivity, burst search strategies, and DSNB analysis.'
