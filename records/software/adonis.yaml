id: adonis
type: software
title: "ADoNIS: A Differentiable generatOr of Neutrino Interaction Samples"
short: "ADoNIS: fully differentiable neutrino interaction event generator (exact gradients through the whole simulation)"
description: |-
  Neutrino interaction event generator that is differentiable end to end: exact derivatives with respect to physics
  parameters are propagated through the nuclear ground state, the hard-scattering amplitudes and the stochastic
  intranuclear cascade, so reweighting and its gradients are directly available. Follows the physics choices of
  ACHILLES and agrees with it for neutrino, electron and hadron probes; the Jacobian shows which measurements constrain
  which parameters, for fit, tuning, measurement and experiment design, and feeds frequentist or Bayesian inference.
