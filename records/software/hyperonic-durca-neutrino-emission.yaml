title: Software for Hyperonic Direct-Urca Neutrino Emission with Lattice-QCD-Informed Form Factors
short: 'Hyperonic direct-Urca neutrino emission with lattice-QCD-informed form factors: code'
description: Software and computational notebooks accompanying the manuscript “Hyperonic Direct-Urca Neutrino Emission with Lattice-QCD-Informed Form Factors.” The archive contains the Python analysis used to compute hyperonic FSU2H and FSU2R equations of state, direct-Urca thresholds and emissivities, TOV stellar sequences, redshifted neutrino luminosities, and manuscript figures, together with the Mathematica notebook used for the symbolic six-form-factor matrix-element calculation.
