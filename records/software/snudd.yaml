title: SNuDD
short: 'SNuDD: solar-neutrino nuclear and electron recoil spectra at direct-detection experiments'
description: SNuDD is a Python package for computing the solar neutrino nuclear and electron recoil spectra at direct detection experiments. SNuDD accounts for both solar and terrestrial neutrino propagation effects as well as for modifications of the neutrino-nucleus and -electron scattering cross sections due to new physics, including detector effects.
