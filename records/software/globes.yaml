id: globes
type: software
title: GLoBES — General Long Baseline Experiment Simulator
short: "GLoBES: C library + AEDL language for simulating long-baseline and reactor experiments and their sensitivities"
description: |-
  Simulates neutrino oscillation experiments described in the Abstract Experiment Definition Language (AEDL):
  rates, χ² with systematics, correlations and degeneracies. Widely used for sensitivity studies; many experiment
  definitions (AEDL files) are distributed with it or by third parties.
