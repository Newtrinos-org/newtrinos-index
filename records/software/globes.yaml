card:
  summary: "The standard tool for long-baseline and reactor sensitivity studies."
  intended_use: "Sensitivity and physics-reach studies with parametrised detectors (AEDL); new-physics engines via user-defined probabilities."
  out_of_scope_use: "Fits to real data with full experimental systematics; atmospheric neutrinos (no zenith integration)."
  physics_assumptions: "Detector response by migration matrices or Gaussian smearing; systematics as normalisation/tilt pulls; constant-density layers for matter."
  validation: "Not yet compared with Newtrinos."
  known_limitations: "Licence not stated on the landing page (to be checked in the tarball); AEDL files of different authors vary in quality and provenance."
  maintenance: "Version 3.0 is the latest stable release; development pace low."
curation:
  status: curated
  added: 2026-10-23
  source: manual
  quality_notes: ["licence: GLoBES is believed to be GPL; landing page does not state it — check the tarball before setting"]
