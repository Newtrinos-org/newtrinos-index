id: gseagen
type: software
title: 'gSeaGen: The KM3NeT GENIE-based code for neutrino telescopes'
short: 'gSeaGen: KM3NeT GENIE-based neutrino event generator for neutrino telescopes'
description: The gSeaGen code is a GENIE-based application developed to efficiently generate high statistics samples of events, induced by neutrino interactions, detectable in a neutrino telescope. The gSeaGen code is able to generate events induced by all neutrino flavours, considering topological differences between track-type and shower-like events. Neutrino interactions are simulated taking into account the density and the composition of the media surrounding the detector. The main features of gSeaGen are presented together with some examples of its application within the KM3NeT project.
