id: prometheus
type: software
title: "Prometheus: An open-source neutrino telescope simulation"
short: "Prometheus: Python framework simulating neutrino telescopes in ice and water, from injection to photon detection"
description: |-
  Simulation package for neutrino telescopes of arbitrary geometry in ice or water: neutrino injection
  (LeptonInjector), charged-lepton propagation (PROPOSAL), photon propagation and detector response, with
  configurations for existing and proposed detectors. Used to generate NuBench.
url_landing: "https://harvard-neutrino.github.io/prometheus/"
creators: [{name: Jeffrey Lazar}, {name: Stephan Meighen-Berger}, {name: Christian Haack}, {name: David Kim}, {name: Santiago Giner}, {name: Carlos A. Argüelles}]
