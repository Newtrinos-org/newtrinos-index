id: lar-neutron-horizon-trace-isotopes
type: software
title: 'Trace isotopes set the neutron horizon of liquid argon: analysis code and simulation data'
short: 'Trace isotopes and the neutron horizon of liquid argon: code and simulation data'
description: 'This record contains the analysis code and supporting simulation data for the manuscript Trace isotopes set the neutron horizon of liquid argon.


  The files include Python scripts for neutron cross-section comparisons, analysis of ARTIE transmission data, effective argon-36 constraints and neutron transport calculations. FLUKA input decks and per-cycle scoring outputs are provided for the long-distance transport calculations and the DUNE-scale and ProtoDUNE-sized detector models.


  The repository includes the numerical records used to study argon-41 capture distributions, together with run identifiers, processed nuclear-data checksums and instructions for reproducing the analyses.


  The transport simulations used FLUKA 4-5.2 and neutron evaluations including JEFF-3.3, JENDL-5, ENDF/B-VIII.1 and JEFF-4.0. FLUKA and third-party nuclear-data libraries are not redistributed. The original experimental measurements are attributed to ARTIE and the corresponding nuclear-data sources.'
