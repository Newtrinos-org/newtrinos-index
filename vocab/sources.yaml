- {id: supernova, label: Supernova, description: "Core-collapse supernova neutrinos, burst and diffuse background (DSNB)."}
- {id: astrophysical, label: Astrophysical (high energy), description: "Diffuse and point-source high-energy cosmic neutrinos."}
- {id: cosmogenic, label: Cosmogenic, description: "Ultra-high-energy neutrinos from cosmic-ray interactions with photon backgrounds."}
- {id: relic, label: Relic (CνB), description: "The cosmic neutrino background."}
- {id: cosmology, label: Cosmology, description: "Neutrino properties from cosmological observables (CMB, BAO, LSS)."}
- {id: radioactive-source, label: Radioactive source, description: "Artificial sources (51Cr, 37Ar, 144Ce) used in source experiments."}
- {id: nuclear-decay, label: Nuclear decay, description: "Beta decay endpoints (tritium, 163Ho) and double-beta decay; neutrino properties without detecting neutrinos."}
